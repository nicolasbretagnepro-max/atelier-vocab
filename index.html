// ─── XP HELPERS ──────────────────────────────────────────────────────────────
function calcXP(state, word, mode) {
  let xp = mode === "discover" ? 3 : mode === "prod" ? 10 : 5;
  const wp = readP(state, word.id);
  if ((wp.wrong || 0) > 0) xp = Math.max(xp, 10);
  else if (wordStatus(state, word) === "Maîtrisé") xp = Math.min(xp, 3);
  return xp;
}
function calcStreakBonus(prev, next) {
  for (const m of [3, 5, 10]) {
    if (prev < m && next >= m) return m === 3 ? 2 : m === 5 ? 5 : 10;
  }
  return 0;
}

// ─── QUIZ SESSION (cœurs + XP) ────────────────────────────────────────────────
function QuizSession({words, state, setState, onMilestone, onBack, title, color, filterFn}) {
  const SIZES = [5,10,15,20];
  const availableWords = useMemo(() => {
    const base = filterFn ? words.filter(filterFn) : words;
    return base.length ? base : words;
  }, [words, state, filterFn]);
  const availableCount = availableWords.length;
  const enabledSizes = SIZES.filter(n => availableCount >= n);
  const defaultSize = enabledSizes.includes(10) ? 10 : (enabledSizes[0] || 5);
  const [maxQ, setMaxQ] = useState(defaultSize);
  const [started, setStarted] = useState(false);
  const [pool, setPool] = useState([]);
  const [idx, setIdx] = useState(0);
  const [hearts, setHearts] = useState(3);
  const [streak, setStreak] = useState(0);
  const [xpSession, setXpSession] = useState(0);
  const [log, setLog] = useState([]);
  const [done, setDone] = useState(false);
  const [bonusAwarded, setBonusAwarded] = useState(false);
  const timerRef = useRef(null);
  useEffect(() => () => { if (timerRef.current) clearTimeout(timerRef.current); }, []);
  const current = pool[idx];
  const total = pool.length;
  const resetSession = useCallback(() => {
    if (timerRef.current) clearTimeout(timerRef.current);
    setIdx(0); setHearts(3); setStreak(0); setXpSession(0); setLog([]); setDone(false); setBonusAwarded(false);
  }, []);
  const startSession = useCallback(() => {
    resetSession();
    setPool(shuffle(availableWords).slice(0, maxQ));
    setStarted(true);
  }, [availableWords, maxQ, resetSession]);
  const restartSession = useCallback(() => {
    resetSession();
    setPool(shuffle(availableWords).slice(0, maxQ));
    setStarted(true);
  }, [availableWords, maxQ, resetSession]);
  const perfectSession = done && log.length > 0 && log.every(e => e.ok);
  useEffect(() => {
    if (!perfectSession || bonusAwarded) return;
    const ns = awardXpBonus(state, 20, "perfect");
    setState(ns);
    const m = checkMilestones(ns, words);
    if (m) onMilestone(m);
    setBonusAwarded(true);
  }, [perfectSession, bonusAwarded, state, setState, words, onMilestone]);
  const advance = useCallback((ok) => {
    if (!current) return;
    const newStreak = ok ? streak + 1 : 0;
    let xp = 0;
    if (ok) { xp = calcXP(state, current, "recog"); xp += calcStreakBonus(streak, newStreak); }
    const newHearts = ok ? hearts : hearts - 1;
    const ns = gradeWord(state, current.id, ok ? "good" : "again", "recog", xp);
    setState(ns); setStreak(newStreak);
    if (!ok) setHearts(newHearts);
    setXpSession(x => x + xp);
    const newLog = [...log, {word: current, ok}]; setLog(newLog);
    const m = checkMilestones(ns, words); if (m) onMilestone(m);
    if (!ok && newHearts <= 0) return;
    timerRef.current = setTimeout(() => { if (idx + 1 >= total) setDone(true); else setIdx(i => i + 1); }, ok ? 600 : 0);
  }, [current, state, setState, streak, hearts, idx, total, words, onMilestone, log]);

  if (!started) return (
    <Card style={{display:"flex",flexDirection:"column",gap:16,animation:"fadeSlideIn 0.25s ease"}}>
      <div>
        <button onClick={onBack} style={{background:"none",border:"none",color:C.blue,fontSize:14,cursor:"pointer",padding:0,marginBottom:12,fontWeight:650}}>← Retour</button>
        <h2 style={{fontSize:22,fontWeight:850,color:C.text,margin:"0 0 6px"}}>{title}</h2>
        <p style={{fontSize:14,color:C.sub,lineHeight:1.55,margin:0}}>
          Choisis la durée de ta session selon le temps disponible. Les mots sont tirés parmi ceux disponibles pour ce mode.
        </p>
      </div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        {SIZES.map(n => {
          const disabled = availableCount < n;
          return (
            <button key={n} onClick={()=>!disabled&&setMaxQ(n)} disabled={disabled} style={{
              padding:"10px 20px",borderRadius:14,fontWeight:750,fontSize:15,
              border:`2px solid ${maxQ===n?color||C.blue:C.border}`,
              background:maxQ===n?`${color||C.blue}14`:C.solid,
              color:disabled?C.ter:maxQ===n?color||C.blue:C.sub,
              cursor:disabled?"not-allowed":"pointer",
              opacity:disabled?0.5:1
            }}>{n}</button>
          );
        })}
      </div>
      <p style={{fontSize:13,color:C.sub,lineHeight:1.5,margin:0}}>
        {availableCount >= 5 ? `${availableCount} mots disponibles pour ce quiz.` : `Il faut au moins 5 mots disponibles. Actuellement : ${availableCount}.`}
      </p>
      <Btn label={`Démarrer — ${maxQ} mots`} variant="primary" onClick={startSession} disabled={availableCount < 5}/>
    </Card>
  );

  if (hearts <= 0 && !done) return (
    <div style={{textAlign:"center",padding:"40px 0"}}>
      <div style={{fontSize:52,marginBottom:12}}>💔</div>
      <h2 style={{fontSize:22,fontWeight:700,marginBottom:10,color:C.text}}>Session terminée</h2>
      <p style={{fontSize:14,color:C.sub,lineHeight:1.6,marginBottom:24}}>Tes erreurs ont été ajoutées à tes révisions.</p>
      <div style={{display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap"}}>
        <Btn label="Rejouer" variant="primary" onClick={restartSession}/>
        <Btn label="Retour" variant="ghost" onClick={onBack}/>
      </div>
    </div>
  );

  if (done || !current) {
    const nOk = log.filter(e => e.ok).length; const nWrong = log.filter(e => !e.ok).length;
    const perfect = nWrong === 0 && nOk > 0; const totalXp = xpSession + (perfect ? 20 : 0);
    return (
      <div style={{display:"flex",flexDirection:"column",gap:14,animation:"fadeSlideIn 0.3s ease"}}>
        <div style={{textAlign:"center",padding:"24px 0 12px"}}>
          <div style={{fontSize:52,marginBottom:10}}>{perfect ? "🏆" : "🎉"}</div>
          <h2 style={{fontSize:22,fontWeight:800,color:C.text,marginBottom:6}}>{perfect ? "Session parfaite !" : "Session terminée"}</h2>
          <p style={{color:C.sub,fontSize:14}}>+{totalXp} XP · {nOk} ✓ · {nWrong} ✗</p>
          {perfect && <p style={{color:C.orange,fontWeight:700,fontSize:13,marginTop:4}}>+20 XP bonus !</p>}
        </div>
        <Btn label="Retour" variant="primary" full onClick={onBack}/>
      </div>
    );
  }

  return (
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <div style={{display:"flex",gap:8,alignItems:"center"}}>
        <div style={{flex:1,background:"rgba(0,0,0,0.08)",borderRadius:99,height:5,overflow:"hidden"}}>
          <div style={{height:"100%",borderRadius:99,background:color||C.blue,width:(Math.round(idx/Math.max(total,1)*100))+"%",transition:"width 0.3s"}}/>
        </div>
        <span style={{fontSize:14,color:C.red,fontWeight:700}}>{"♥".repeat(Math.max(0,hearts))}{"♡".repeat(Math.max(0,3-hearts))}</span>
        <span style={{fontSize:14,color:C.orange,fontWeight:700}}>+{xpSession}</span>
      </div>
      <div style={{fontSize:12,color:C.sub,fontWeight:600,letterSpacing:0.8,textTransform:"uppercase"}}>{title} · {idx+1}/{total}</div>
      <ReviewQuizChoice key={"qs-"+current.id+"-"+idx} word={current} words={words} questionIndex={idx} onAnswer={(ok)=>advance(ok)}/>
    </div>
  );
}

// ─── FLASHCARD SESSION ────────────────────────────────────────────────────────
function FlashcardSession({words, state, setState, onMilestone, onBack}) {
  const BATCH = 20;
  const [batchOffset, setBatchOffset] = useState(0);
  // Shuffle une seule fois au montage → lots non redondants
  const shuffledAll = useMemo(() => {
    const seen = words.filter(w => readP(state, w.id).seen > 0);
    return shuffle(seen.length ? seen : words);
  }, []);
  const pool = useMemo(() => shuffledAll.slice(batchOffset, batchOffset + BATCH), [batchOffset]);
  const [idx, setIdx] = useState(0);
  const [shown, setShown] = useState(false);
  const [batchDone, setBatchDone] = useState(false);

  if (!pool.length) return (
    <Card style={{textAlign:"center",padding:"40px 24px"}}>
      <p style={{color:C.sub,marginBottom:16}}>Aucun mot vu. Lance d'abord la routine !</p>
      <Btn label="Retour" variant="primary" onClick={onBack}/>
    </Card>
  );

  const current = pool[idx];

  if (batchDone) {
    const hasMore = batchOffset + BATCH < shuffledAll.length;
    return (
      <div style={{textAlign:"center",padding:"32px 0",display:"flex",flexDirection:"column",gap:14,alignItems:"center"}}>
        <div style={{fontSize:48}}>✅</div>
        <h2 style={{fontSize:20,fontWeight:800,color:C.text}}>Lot de {pool.length} mots revu !</h2>
        {hasMore ? <Btn label="Continuer avec 20 autres mots" variant="primary" onClick={()=>{setBatchOffset(b=>b+BATCH);setIdx(0);setShown(false);setBatchDone(false);}}/> : <Btn label="Tout revu !" variant="default" disabled/>}
        <Btn label="Retour" variant="ghost" onClick={onBack}/>
      </div>
    );
  }
  if (!current) return null;
  const cx = readP(state, current.id);

  const grade = (rating) => {
    const xp = rating === "again" ? 0 : rating === "easy" ? 8 : rating === "good" ? 10 : 15;
    const ns = gradeWord(state, current.id, rating, "recog", xp);
    setState(ns); const m = checkMilestones(ns, words); if (m) onMilestone(m);
    setShown(false);
    if (idx + 1 >= pool.length) setBatchDone(true); else setIdx(i => i + 1);
  };

  return (
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{fontSize:12,color:C.sub,fontWeight:600,textTransform:"uppercase",letterSpacing:0.8}}>Carte {idx+1}/{pool.length}</span>
        <div style={{display:"flex",gap:3}}>{pool.map((_,i)=><div key={i} style={{width:16,height:5,borderRadius:99,background:i<idx?C.green:i===idx?C.blue:"rgba(0,0,0,0.1)"}}/>)}</div>
      </div>
      <Card>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}><Pill label={current.nature} color={C.purple}/><Pill label={current.theme} color={THEME_COLOR[current.theme]}/></div>
        <WordTitle>{current.word}</WordTitle>
        {!shown ? (
          <><p style={{fontSize:14,color:C.ter,marginBottom:12}}>Retrouve mentalement la définition, puis révèle.</p><ExampleBlock word={current} showLabel={false} fontSize={14}/><Btn label="Révéler la définition" variant="primary" full onClick={()=>setShown(true)}/></>
        ) : (
          <>
            <p style={{fontSize:17,fontWeight:700,color:C.text,marginBottom:6}}>{current.compact}</p>
            <p style={{fontSize:14,color:C.sub,lineHeight:1.65,marginBottom:10}}>{current.definition}</p>
            <ExampleBlock word={current}/><ConfusionBlock word={current} words={words} compact/>
            <div style={{background:"rgba(0,0,0,0.04)",borderRadius:12,padding:"10px 14px",marginBottom:14}}>
              <div style={{fontSize:12,color:C.sub,display:"flex",gap:16,marginBottom:6,flexWrap:"wrap"}}><span>Recog. {cx.recog}/6</span><span>Prod. {cx.prod}/6</span><span>{getRate(state,current)}%</span></div>
              <Bar value={(cx.mastery/6)*100} color={C.blue}/>
            </div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              {[["Oublié","again",C.red],["Difficile","hard",C.orange],["Bien","good",C.blue],["Facile","easy",C.green]].map(([l,r,c])=>(
                <button key={r} onClick={()=>grade(r)} style={{flex:1,minWidth:86,padding:"9px 4px",borderRadius:12,border:"1.5px solid "+c+"30",background:c+"12",color:c,fontWeight:700,fontSize:13,cursor:"pointer"}}>{l}</button>
              ))}
            </div>
          </>
        )}
      </Card>
    </div>
  );
}

    </div>
  );

// ─── QUIZ TAB NEW (cœurs + XP sur quick) ─────────────────────────────────────
function QuizTabNew({words, state, setState, onMilestone, mode="quick", onModeChange}) {
  if (mode === "nuance") return <NuanceQuiz words={words} state={state} setState={setState} onMilestone={onMilestone} onBackToQuick={()=>onModeChange&&onModeChange("quick")}/>;

  const SIZES = [5,10,15,20];
  const [maxQ, setMaxQ] = useState(10);
  const [started, setStarted] = useState(false);
  const [hearts, setHearts] = useState(3);
  const [streak, setStreak] = useState(0);
  const [xpSession, setXpSession] = useState(0);
  const [count, setCount] = useState(0);
  const [score, setScore] = useState(0);
  const [done, setDone] = useState(false);
  const [bonusAwarded, setBonusAwarded] = useState(false);
  const [w, setW] = useState(null);
  const [selected, setSelected] = useState(null);
  const stateRef = useRef(state);
  const askedRef = useRef(new Set());
  const timerRef = useRef(null);

  useEffect(() => { stateRef.current = state; }, [state]);
  useEffect(() => () => { if (timerRef.current) clearTimeout(timerRef.current); }, []);
  const perfectSession = done && score === maxQ;
  useEffect(() => {
    if (!perfectSession || bonusAwarded) return;
    const ns = awardXpBonus(stateRef.current, 20, "perfect");
    stateRef.current = ns;
    setState(ns);
    const m = checkMilestones(ns, words);
    if (m) onMilestone(m);
    setBonusAwarded(true);
  }, [perfectSession, bonusAwarded, setState, words, onMilestone]);

  const quiz = useMemo(() => w ? {w, options: shuffle([w,...smartDistractors(w, words, 3)])} : null, [w, words]);

  const getNext = useCallback(() => {
    const next = candidates(stateRef.current, words, "smart", 1, askedRef.current)[0];
    if (next) return next;
    askedRef.current = new Set();
    return candidates(stateRef.current, words, "smart", 1)[0];
  }, [words]);

  const startQuiz = () => {
    askedRef.current = new Set();
    setCount(0); setScore(0); setDone(false); setSelected(null);
    setHearts(3); setStreak(0); setXpSession(0); setBonusAwarded(false);
    setW(getNext()); setStarted(true);
  };

  const moveNext = (nextCount) => {
    setCount(nextCount);
    if (nextCount >= maxQ) { setDone(true); setStarted(false); }
    else { setSelected(null); setW(getNext()); }
  };

  const handleAnswer = (o) => {
    if (selected || !w) return;
    setSelected(o.id);
    askedRef.current.add(w.id);
    const ok = o.id === w.id;
    const newStreak = ok ? streak + 1 : 0;
    let xp = 0;
    if (ok) { xp = calcXP(stateRef.current, w, "recog"); xp += calcStreakBonus(streak, newStreak); }
    const newHearts = ok ? hearts : hearts - 1;
    const ns = gradeWord(stateRef.current, w.id, ok ? "good" : "again", "recog", xp);
    stateRef.current = ns; setState(ns); setStreak(newStreak);
    if (!ok) setHearts(newHearts);
    setXpSession(x => x + xp);
    const m = checkMilestones(ns, words); if (m) onMilestone(m);
    if (ok) setScore(s => s+1);
    const next = count + 1;
    if (!ok && newHearts <= 0) return; // hearts=0 screen
    if (ok) timerRef.current = setTimeout(() => moveNext(next), 650);
  };

  if (hearts <= 0 && started && !done) return (
    <div style={{textAlign:"center",padding:"40px 0"}}>
      <div style={{fontSize:52,marginBottom:12}}>💔</div>
      <h2 style={{fontSize:22,fontWeight:700,marginBottom:10,color:C.text}}>Session terminée</h2>
      <p style={{fontSize:14,color:C.sub,lineHeight:1.6,marginBottom:24}}>Tes erreurs ont été ajoutées à tes révisions.</p>
      <div style={{display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap"}}>
        <Btn label="Rejouer" variant="primary" onClick={startQuiz}/>
        <Btn label="Changer le nombre" variant="ghost" onClick={()=>{setStarted(false);setDone(false);}}/>
      </div>
    </div>
  );

  if (!started && !done) return (
    <Card style={{textAlign:"center",padding:"36px 24px"}}>
      <div style={{fontSize:48,marginBottom:14}}>⚡️</div>
      <h2 style={{fontSize:22,fontWeight:800,color:C.text,marginBottom:8}}>Quiz rapide</h2>
      <p style={{fontSize:14,color:C.sub,marginBottom:24,lineHeight:1.6}}>3 cœurs par session. Bonne réponse = +XP.</p>
      <div style={{display:"flex",gap:10,justifyContent:"center",marginBottom:28,flexWrap:"wrap"}}>
        {SIZES.map(n=><button key={n} onClick={()=>setMaxQ(n)} style={{padding:"10px 22px",borderRadius:14,fontWeight:700,fontSize:15,border:"2px solid "+(maxQ===n?C.blue:C.border),background:maxQ===n?C.blue+"14":C.solid,color:maxQ===n?C.blue:C.sub,cursor:"pointer"}}>{n}</button>)}
      </div>
      <Btn label={"Démarrer — "+maxQ+" questions"} variant="primary" onClick={startQuiz}/>
    </Card>
  );

  if (done) {
    const perfect = score === maxQ; const totalXp = xpSession + (perfect ? 20 : 0);
    return (
      <Card style={{textAlign:"center",padding:"36px 24px"}}>
        <div style={{fontSize:56,marginBottom:12}}>{perfect?"🏆":score>=maxQ*0.8?"👍":"💪"}</div>
        <h2 style={{fontSize:24,fontWeight:800,color:C.text,marginBottom:8}}>{score} / {maxQ}</h2>
        <p style={{fontSize:15,color:C.sub,marginBottom:8}}>+{totalXp} XP{perfect?" · Session parfaite !":""}</p>
        <div style={{display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap",marginTop:16}}>
          <Btn label="Rejouer" variant="primary" onClick={startQuiz}/>
          <Btn label="Changer le nombre" variant="ghost" onClick={()=>{setDone(false);setStarted(false);}}/>
        </div>
      </Card>
    );
  }

  if (!w || !quiz) return <div style={{color:C.sub,textAlign:"center",padding:48}}>Chargement…</div>;
  const wrong = selected && selected !== w.id;

  return (
    <div style={{display:"flex",flexDirection:"column",gap:12}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <div style={{flex:1}}><Bar value={(count/maxQ)*100} color={C.blue}/></div>
        <span style={{fontSize:13,color:C.sub,fontWeight:600}}>{count+1}/{maxQ}</span>
        <span style={{fontSize:13,color:C.red,fontWeight:700}}>{"♥".repeat(Math.max(0,hearts))}{"♡".repeat(Math.max(0,3-hearts))}</span>
        <span style={{fontSize:13,color:C.orange,fontWeight:700}}>+{xpSession}</span>
      </div>
      <Card>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}><Pill label={w.nature} color={C.purple}/><Pill label={w.theme} color={THEME_COLOR[w.theme]}/></div>
        <WordTitle>{w.word}</WordTitle>
        <div className="choice-grid">
          {quiz.options.map(o => {
            let bg=C.solid,border=C.border,color=C.text,weight=500;
            if (selected) { if(o.id===w.id){bg=C.green+"22";border=C.green;weight=700;} else if(o.id===selected){bg=C.red+"18";border=C.red;color=C.sub;} else color=C.ter; }
            return <button key={o.id} onClick={()=>handleAnswer(o)} disabled={!!selected} style={{padding:"13px 12px",borderRadius:14,border:"1.5px solid "+border,background:bg,textAlign:"left",cursor:selected?"default":"pointer",fontSize:13,fontWeight:weight,color,lineHeight:1.45,transition:"all 0.25s"}}>{o.compact}{o.id===w.id&&selected?" ✓":""}</button>;
          })}
        </div>
        {wrong && (
          <div style={{marginTop:14,animation:"fadeSlideIn 0.3s ease"}}>
            <ExampleBlock word={w}/>
            <p style={{fontSize:13,color:C.sub,margin:"0 0 12px",lineHeight:1.5}}>{w.definition}</p>
            <Btn label="J'ai compris" variant="primary" full onClick={()=>moveNext(count+1)}/>
          </div>
        )}
      </Card>
    </div>
  );
}

function App() {
  const initialStoredWords = useMemo(()=>loadCustomWords(),[]);
  const initialStoredFigures = useMemo(()=>loadCustomFigures(),[]);
  const initialExtraSources = useMemo(()=>loadExtraSources(),[]);
  const initialSourceCache = useMemo(()=>loadSourceCache(),[]);
  const [tab,setTab] = useState("home");
  const [learnMode,setLearnMode] = useState("smart");
  const [quizMode,setQuizMode] = useState("quick");
  const [state,setState] = useState(loadProgress);
  const [rawWords,setRawWords] = useState(()=>initialStoredWords || (VOCAB_URL ? [] : SEED_WORDS));
  const [rawFigures,setRawFigures] = useState(()=>initialStoredFigures || (FIGURES_URL ? [] : SEED_FIGURES));
  const [hasStoredWords,setHasStoredWords] = useState(()=>!!initialStoredWords);
  const [hasStoredFigures,setHasStoredFigures] = useState(()=>!!initialStoredFigures);
  const [showImport,setShowImport] = useState(false);
  const [showSources,setShowSources] = useState(false);
  const [showReset,setShowReset] = useState(false);
  const [showSync,setShowSync] = useState(false);
  const [milestone,setMilestone] = useState(null);
  const [extraSources,setExtraSources] = useState(initialExtraSources);
  const [extraWordsBySource,setExtraWordsBySource] = useState(initialSourceCache);
  const [sourcesStatus,setSourcesStatus] = useState(null);
  const [fetchStatus,setFetchStatus] = useState(()=>initialStoredWords || !VOCAB_URL ? null : "loading");
  const [figuresStatus,setFiguresStatus] = useState(()=>initialStoredFigures || !FIGURES_URL ? null : "loading");

  const mainWords = useMemo(()=>buildWords(rawWords,"vocab"),[rawWords]);
  const extraWordGroups = useMemo(()=>extraSources.filter(s=>s.enabled !== false).map(src => ({
    sourceId: src.id,
    sourceLabel: src.label,
    items: buildWords(extraWordsBySource[src.id] || [], "vocab")
  })), [extraSources, extraWordsBySource]);
  const mergedVocabulary = useMemo(()=>mergeWordsPriority([
    { sourceId:"vocab-general", sourceLabel:"Vocabulaire principal", items: mainWords },
    ...extraWordGroups
  ]), [mainWords, extraWordGroups]);
  const words = mergedVocabulary.items;
  const duplicateWords = mergedVocabulary.skipped;
  const figures = useMemo(()=>buildWords(rawFigures,"figure"),[rawFigures]);
  const allItems = useMemo(()=>[...words, ...figures],[words,figures]);
  const total = words.length;
  const mastered = words.filter(w=>wordStatus(state,w)==="Maîtrisé").length;
  const figuresMastered = figures.filter(w=>wordStatus(state,w)==="Maîtrisé").length;
  const dueCount = useMemo(()=>words.filter(w=>isDue(state,w)&&readP(state,w.id).seen>0).length,[words,state]);

  const loadRemoteVocabulary = useCallback((force=false) => {
    if (!VOCAB_URL) return;
    setFetchStatus("loading");
    fetch(dataUrl(VOCAB_URL, force), { cache: "no-store" })
      .then(r=>{ if(!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
      .then(data=>{
        const error = validateVocabArray(data);
        if (error) throw new Error(error);
        saveCustomWords(data);
        saveProgress(state);
        setRawWords(data);
        setHasStoredWords(true);
        setFetchStatus("done");
        setTimeout(()=>setFetchStatus(null), 3000);
      })
      .catch(err=>{
        console.warn("Chargement vocabulaire échoué :", err);
        if (!rawWords.length) setRawWords(SEED_WORDS);
        setFetchStatus("error");
      });
  }, [rawWords.length, state, figures]);

  const loadRemoteFigures = useCallback((force=false) => {
    if (!FIGURES_URL) return;
    setFiguresStatus("loading");
    fetch(dataUrl(FIGURES_URL, force), { cache: "no-store" })
      .then(r=>{ if(!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
      .then(data=>{
        const error = validateVocabArray(data);
        if (error) throw new Error(error);
        saveCustomFigures(data);
        saveProgress(state);
        setRawFigures(data);
        setHasStoredFigures(true);
        setFiguresStatus("done");
        setTimeout(()=>setFiguresStatus(null), 3000);
      })
      .catch(err=>{
        console.warn("Chargement figures échoué :", err);
        if (!rawFigures.length) setRawFigures(SEED_FIGURES);
        setFiguresStatus("error");
      });
  }, [rawFigures.length, state, words]);


  const persistExtraSources = (nextSources) => {
    const saved = saveExtraSources(nextSources);
    setExtraSources(saved);
    return saved;
  };

  const fetchExtraSource = useCallback((src, force=false) => {
    const source = normalizeVocabSource(src);
    if (!source || source.enabled === false) return Promise.resolve(null);
    return fetch(dataUrl(source.url, force), { cache:"no-store" })
      .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
      .then(data => {
        const error = validateVocabArray(data);
        if (error) throw new Error(error);
        return { source:{ ...source, lastLoadedAt:new Date().toISOString(), lastError:null }, data };
      })
      .catch(err => {
        console.warn("Chargement source vocabulaire échoué :", source.url, err);
        return { source:{ ...source, lastError:err.message || "Erreur de chargement" }, data:null };
      });
  }, []);

  const loadExtraVocabularySources = useCallback((force=false) => {
    const active = extraSources.filter(s => s.enabled !== false);
    if (!active.length) return;
    setSourcesStatus("loading");
    Promise.all(active.map(src => fetchExtraSource(src, force))).then(results => {
      const nextSources = [...extraSources];
      const nextCache = { ...loadSourceCache(), ...extraWordsBySource };
      results.filter(Boolean).forEach(result => {
        const idx = nextSources.findIndex(s => s.id === result.source.id);
        if (idx >= 0) nextSources[idx] = result.source;
        if (Array.isArray(result.data)) nextCache[result.source.id] = result.data;
      });
      saveSourceCache(nextCache);
      persistExtraSources(nextSources);
      setExtraWordsBySource(nextCache);
      setSourcesStatus("done");
      setTimeout(()=>setSourcesStatus(null), 2500);
    }).catch(() => {
      setSourcesStatus("error");
    });
  }, [extraSources, extraWordsBySource, fetchExtraSource]);

  useEffect(()=>{
    if (extraSources.some(s => s.enabled !== false)) loadExtraVocabularySources(false);
  }, []);

  const handleAddSource = (source) => {
    const src = normalizeVocabSource(source);
    if (!src) return;
    const nextSources = persistExtraSources([...extraSources, src]);
    setSourcesStatus("loading");
    fetchExtraSource(src, true).then(result => {
      const nextCache = { ...loadSourceCache(), ...extraWordsBySource };
      const updatedSources = [...nextSources];
      if (result) {
        const idx = updatedSources.findIndex(s => s.id === result.source.id);
        if (idx >= 0) updatedSources[idx] = result.source;
        if (Array.isArray(result.data)) nextCache[result.source.id] = result.data;
      }
      saveSourceCache(nextCache);
      persistExtraSources(updatedSources);
      setExtraWordsBySource(nextCache);
      setSourcesStatus("done");
      setTimeout(()=>setSourcesStatus(null), 2500);
    });
  };

  const handleRemoveSource = (id) => {
    const nextSources = extraSources.filter(s => s.id !== id);
    const nextCache = { ...extraWordsBySource };
    delete nextCache[id];
    persistExtraSources(nextSources);
    saveSourceCache(nextCache);
    setExtraWordsBySource(nextCache);
  };

  const handleToggleSource = (id) => {
    const nextSources = extraSources.map(s => s.id === id ? { ...s, enabled: s.enabled === false } : s);
    persistExtraSources(nextSources);
  };

  useEffect(()=>{
    if (VOCAB_URL) loadRemoteVocabulary(false);
    if (FIGURES_URL) loadRemoteFigures(false);
  }, []);

  const handleImportWords = (data) => {
    saveProgress(state);
    setRawWords(data);
    setHasStoredWords(true);
    clearDailyDone();
  };

  const handleReset = () => {
    const fresh = {progress:{},meta:{...DEFAULT_META}};
    saveProgress(fresh);
    try { localStorage.removeItem(STORE_MILESTONE); } catch {}
    updateProfilePatch({ progress:{}, meta:{...DEFAULT_META}, milestones:[], dailyDone:null });
    clearDailyDone();
    setState(fresh);
    setShowReset(false);
  };

  const handleImportProgress = (data) => {
    const profileData = data.profileData || data;
    const currentHash = hashString(allItems.map(w=>w.id).join("|"));
    if (data.vocabHash && data.vocabHash !== currentHash) {
      const ok = window.confirm("Cette sauvegarde semble liée à une autre version des corpus. Importer quand même la progression et les sources ?");
      if (!ok) return;
    }
    const ns = normalizeLoadedProgress(profileData);
    saveProgress(ns);
    setState(ns);
    if (Array.isArray(profileData.sources)) {
      const savedSources = saveExtraSources(profileData.sources);
      setExtraSources(savedSources);
    }
    if (profileData.sourceCache && typeof profileData.sourceCache === "object") {
      saveSourceCache(profileData.sourceCache);
      setExtraWordsBySource(profileData.sourceCache);
    }
    if (profileData.activity && typeof profileData.activity === "object") saveActivity(profileData.activity);
    if (Array.isArray(profileData.milestones)) {
      try { localStorage.setItem(STORE_MILESTONE, JSON.stringify(profileData.milestones)); } catch {}
      updateProfilePatch({ milestones: profileData.milestones });
    }
    setShowSync(false);
  };

  const handleExport = () => {
    const profile = loadProfile();
    const activity = loadActivity();
    const data = {
      type: "atelier-vocab-profile",
      schemaVersion: PROFILE_SCHEMA_VERSION,
      exportedAt: new Date().toISOString(),
      vocabCount: words.length,
      figuresCount: figures.length,
      duplicateIgnoredCount: duplicateWords.length,
      vocabHash: hashString(allItems.map(w=>w.id).join("|")),
      activity,
      regularity: activity,
      profileData: {
        ...profile,
        progress: state.progress,
        meta: state.meta,
        sources: extraSources,
        sourceCache: extraWordsBySource,
        activity,
        milestones: loadSeenMilestones()
      }
    };
    const blob = new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `atelier_vocab_profil_${localDateKey()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const startDaily = () => setTab("daily");
  const startReview = (mode="smart") => { const m={"smart":null,"fragile":"quiz-errors","due":"quiz-review"}; setLearnMode(m[mode]!==undefined?m[mode]:null); setTab("learn"); };
  const startQuiz = (mode="quick") => { setQuizMode(mode); setTab("quiz"); };
  const startFigures = () => setTab("figures");

  return (
    <div style={{minHeight:"100vh",background:C.bg}}>
      {milestone&&<MilestoneToast milestone={milestone} onDone={()=>setMilestone(null)}/>} 

      <div style={{maxWidth:760,margin:"0 auto",padding:"24px 18px 80px"}}>
        <div style={{marginBottom:20}}>
          <p style={{fontSize:11,fontWeight:700,letterSpacing:1.4,color:C.sub,textTransform:"uppercase",margin:"0 0 4px"}}>Atelier vocabulaire</p>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",flexWrap:"wrap",gap:10}}>
            <h1 style={{fontSize:28,fontWeight:800,color:C.text,letterSpacing:-1.2,margin:0}}>Français avancé</h1>
            <div style={{display:"flex",gap:6}}>
              <div style={{background:`${C.orange}18`,color:C.orange,borderRadius:11,padding:"5px 11px",fontSize:12,fontWeight:700}}>🔥 {state.meta.streak||0}j</div>
              <div style={{background:`${C.blue}12`, color:C.blue, borderRadius:11,padding:"5px 11px",fontSize:12,fontWeight:700}}>⚡ {state.meta.xp||0} XP</div>
            </div>
          </div>
          <p style={{fontSize:13,color:C.sub,marginTop:4,marginBottom:0,lineHeight:1.5}}>
            {total} mots {hasStoredWords?"(chargés ✓)":"(démo)"} · {mastered} maîtrisés · {figures.length} figures {hasStoredFigures?"(chargées ✓)":""} · {figuresMastered} maîtrisées
          </p>
          {fetchStatus==="loading" && (
            <div style={{marginTop:8,padding:"8px 14px",borderRadius:10,background:`${C.blue}10`,color:C.blue,fontSize:13,fontWeight:600,display:"inline-flex",alignItems:"center",gap:8}}>
              <span style={{animation:"shimmer 1.2s ease infinite",display:"inline-block"}}>⏳</span> Chargement du vocabulaire…
            </div>
          )}
          {figuresStatus==="loading" && (
            <div style={{marginTop:8,marginLeft:fetchStatus==="loading"?8:0,padding:"8px 14px",borderRadius:10,background:`${C.indigo}10`,color:C.indigo,fontSize:13,fontWeight:600,display:"inline-flex",alignItems:"center",gap:8}}>
              <span style={{animation:"shimmer 1.2s ease infinite",display:"inline-block"}}>✒️</span> Chargement des figures…
            </div>
          )}
          {fetchStatus==="done" && (
            <div style={{marginTop:8,padding:"8px 14px",borderRadius:10,background:`${C.green}12`,color:C.green,fontSize:13,fontWeight:600}}>
              {rawWords.length} mots chargés et mis en cache.
            </div>
          )}
          {figuresStatus==="done" && (
            <div style={{marginTop:8,padding:"8px 14px",borderRadius:10,background:`${C.green}12`,color:C.green,fontSize:13,fontWeight:600}}>
              {rawFigures.length} figures chargées et mises en cache.
            </div>
          )}
          {fetchStatus==="error" && (
            <div style={{marginTop:8,padding:"8px 14px",borderRadius:10,background:`${C.red}10`,color:C.red,fontSize:13,fontWeight:600,lineHeight:1.5}}>
              Impossible de charger le vocabulaire distant. {rawWords.length ? "Fallback local utilisé." : ""} <button onClick={()=>setShowImport(true)} style={{background:"none",border:"none",color:C.red,textDecoration:"underline",cursor:"pointer",fontSize:13,fontWeight:600}}>Importer manuellement</button>
            </div>
          )}
          {figuresStatus==="error" && (
            <div style={{marginTop:8,padding:"8px 14px",borderRadius:10,background:`${C.red}10`,color:C.red,fontSize:13,fontWeight:600,lineHeight:1.5}}>
              Impossible de charger les figures distantes. {rawFigures.length ? "Fallback local utilisé." : ""}
            </div>
          )}
        </div>

        {fetchStatus === "loading" && total === 0 ? (
          <Card style={{textAlign:"center",padding:"48px 24px"}}>
            <div style={{fontSize:42,marginBottom:12,animation:"shimmer 1.2s ease infinite"}}>⏳</div>
            <p style={{fontSize:16,fontWeight:700,color:C.text,marginBottom:6}}>Chargement du vocabulaire</p>
            <p style={{fontSize:14,color:C.sub,lineHeight:1.6}}>L'app attend les données avant de démarrer la routine pour éviter de créer une progression sur les mots de démo.</p>
          </Card>
        ) : (
          <>
            <TabBar active={tab} onSelect={setTab} dueCount={dueCount}/>

            {tab==="home"    && <Dashboard words={words} figures={figures} state={state} onStartDaily={startDaily} onStartReview={()=>startReview("smart")} onStartFragile={()=>startReview("fragile")} onStartDue={()=>startReview("due")} onStartQuiz={()=>startQuiz("quick")} onStartNuance={()=>startQuiz("nuance")} onStartFigures={startFigures}/>} 
            {tab==="daily"   && <DailyTab   words={words} state={state} setState={setState} onMilestone={setMilestone} onGoReview={()=>startReview("fragile")} onGoQuiz={()=>startQuiz("quick")} onGoNuance={()=>startQuiz("nuance")}/>} 
            {tab==="learn"   && <LearnTabNew words={words} state={state} setState={setState} onMilestone={setMilestone} initialMode={learnMode}/>} 
            {tab==="quiz"    && <QuizTabNew  key={"quiz-"+quizMode} words={words} state={state} setState={setState} onMilestone={setMilestone} mode={quizMode} onModeChange={setQuizMode}/>} 
            {tab==="figures" && <FiguresTab figures={figures} state={state} setState={setState} onMilestone={setMilestone} onReloadFigures={()=>loadRemoteFigures(true)} figuresStatus={figuresStatus}/>}
            {tab==="library" && <LibraryTab words={words} state={state}/>} 
            {tab==="stats"   && <StatsTab   words={words} figures={figures} state={state} onOpenImport={()=>setShowImport(true)} onReset={()=>setShowReset(true)} onExport={handleExport} onSync={()=>setShowSync(true)} onReloadRemote={()=>loadRemoteVocabulary(true)} canReloadRemote={!!VOCAB_URL} onReloadFigures={()=>loadRemoteFigures(true)} canReloadFigures={!!FIGURES_URL} onOpenSources={()=>setShowSources(true)} extraSources={extraSources} duplicateCount={duplicateWords.length} sourcesStatus={sourcesStatus}/>} 
          </>
        )}
      </div>

      <ImportModal open={showImport} onClose={()=>setShowImport(false)} currentCount={total} onImport={handleImportWords}/>
      <SourcesModal open={showSources} onClose={()=>setShowSources(false)} sources={extraSources} onAddSource={handleAddSource} onRemoveSource={handleRemoveSource} onToggleSource={handleToggleSource} onReloadSources={()=>loadExtraVocabularySources(true)} status={sourcesStatus} duplicateCount={duplicateWords.length}/>
      <SyncModal   open={showSync}   onClose={()=>setShowSync(false)}   onImportProgress={handleImportProgress}/>
      <ResetModal  open={showReset}  onClose={()=>setShowReset(false)}  onConfirm={handleReset}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
