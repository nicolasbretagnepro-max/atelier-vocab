<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Atelier Vocabulaire · Français avancé</title>
  <meta name="theme-color" content="#007AFF" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #F2F2F7;
      color: #1C1C1E;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    }
    .loader {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      text-align: center;
    }
    .box {
      max-width: 520px;
      background: #fff;
      border-radius: 22px;
      padding: 28px;
      box-shadow: 0 14px 40px rgba(0,0,0,0.08);
    }
    .title {
      font-size: 22px;
      font-weight: 750;
      margin-bottom: 10px;
    }
    .text {
      font-size: 15px;
      line-height: 1.45;
      color: #5b5b66;
    }
    .error {
      color: #B00020;
      margin-top: 14px;
      white-space: pre-wrap;
      text-align: left;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="loader">
    <div class="box">
      <div class="title">Atelier Vocabulaire</div>
      <div class="text">Chargement de l’application…</div>
      <div id="error" class="error" hidden></div>
    </div>
  </div>

  <script>
    /*
      index.html complet prêt à remplacer dans GitHub.

      Objectif de cette version :
      - conserver l'application actuelle ;
      - corriger la logique des exemples en contexte ;
      - empêcher l'affichage de phrases générées du type :
        "On parle d'« Mot » quand on désigne : définition courte".

      Cette page charge la version actuelle de l'application depuis le commit stable
      3716b74, applique la correction au HTML, puis lance l'application corrigée.
    */

    const APP_SOURCE_URL =
      "https://raw.githubusercontent.com/nicolasbretagnepro-max/atelier-vocab/3716b74/index.html";

    function patchAppHtml(html) {
      let patched = String(html || "");

      patched = patched.replace(
        /function isGeneric\(e\)\s*\{[\s\S]*?return !e \|\| \/Dans son article\|Le chroniqueur emploie\|Dans l'analyse\|peut servir à décrire\|Le texte emploie\|Dans le passage\|Le passage emploie\|Dans l'article\|Dans le récit\|Le journaliste emploie\/i\.test\(e\);\s*\}/,
        `function isGeneric(e) {
  return !e || /Dans son article|Le chroniqueur emploie|Dans l'analyse|peut servir à décrire|Le texte emploie|Dans le passage|Le passage emploie|Dans l'article|Dans le récit|Le journaliste emploie|On parle d[’']?«?/i.test(e);
}`
      );

      patched = patched.replace(
        /function makeContextSentence\(w\)\s*\{[\s\S]*?return `On parle d'« \$\{w\.word\} » quand on désigne : \$\{w\.compact \|\| w\.definition \|\| "ce mot"\}\.`;[\s\S]*?\}/,
        `function makeContextSentence(w) {
  // Ancien fallback volontairement neutralisé.
  // Une définition courte ne doit jamais être déguisée en exemple.
  return "";
}

function hasMeaningfulExample(example) {
  const text = String(example || "").trim();
  return text.length > 20 && !isGeneric(text);
}

function buildExamplePairs(w) {
  const pairs = [
    {
      example: String(w.example_1 || "").trim(),
      cloze: String(w.example_cloze_1 || "").trim(),
      type: String(w.example_type_1 || "").trim(),
      clozeType: String(w.example_cloze_type_1 || "").trim()
    },
    {
      example: String(w.example_2 || "").trim(),
      cloze: String(w.example_cloze_2 || "").trim(),
      type: String(w.example_type_2 || "").trim(),
      clozeType: String(w.example_cloze_type_2 || "").trim()
    },
    {
      // Compatibilité avec les anciens corpus.
      // Ce fallback reste un vrai exemple, pas une définition transformée.
      example: String(w.example || "").trim(),
      cloze: String(w.example_cloze || w.cloze || w.phrase_trouee || "").trim(),
      type: String(w.example_type || "").trim(),
      clozeType: String(w.example_cloze_type || "").trim()
    }
  ];

  const seen = new Set();

  return pairs
    .filter(item => hasMeaningfulExample(item.example))
    .filter(item => {
      const key = norm(item.example);
      if (!key || seen.has(key)) return false;
      seen.add(key);
      return true;
    });
}`
      );

      patched = patched.replace(
        /const rawExamples = \[[\s\S]*?\]\.filter\(item => item\.example && item\.example\.length > 20 && !isGeneric\(item\.example\)\);\s*const fallbackExample = String\(w\.example \|\| ""\)\.trim\(\);\s*const examples = rawExamples\.length[\s\S]*?const hasGoodExample = rawExamples\.length > 0 \|\| \(fallbackExample\.length > 20 && !isGeneric\(fallbackExample\)\);/,
        `const examples = buildExamplePairs(w);

const hasGoodExample = examples.length > 0;`
      );

      patched = patched.replace(
        /example: examples\[0\]\?\.example \|\| makeContextSentence\(\{ word: w\.word, compact \}\),/g,
        `example: examples[0]?.example || "",`
      );

      return patched;
    }

    function showError(message) {
      const el = document.getElementById("error");
      if (!el) return;
      el.hidden = false;
      el.textContent = message;
    }

    async function boot() {
      try {
        const response = await fetch(APP_SOURCE_URL, { cache: "no-store" });
        if (!response.ok) {
          throw new Error("Impossible de charger l'application source : HTTP " + response.status);
        }

        const sourceHtml = await response.text();
        const patchedHtml = patchAppHtml(sourceHtml);

        if (!patchedHtml.includes("buildExamplePairs")) {
          throw new Error("La correction des exemples n'a pas pu être injectée.");
        }

        document.open();
        document.write(patchedHtml);
        document.close();
      } catch (error) {
        console.error(error);
        showError(
          "Erreur de chargement de l'application.\n\n" +
          String(error && error.message ? error.message : error)
        );
      }
    }

    boot();
  </script>
</body>
</html>
