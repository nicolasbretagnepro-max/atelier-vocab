// ─── HELPERS ──────────────────────────────────────────────────────────────────
const norm = (s) =>
  String(s || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, " ")
    .trim();

function hashString(str) {
  let h = 2166136261;
  for (let i = 0; i < String(str).length; i++) {
    h ^= String(str).charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return (h >>> 0).toString(36);
}

function stableWordId(w) {
  const provided = String(w.id || w.slug || "").trim();
  if (provided) return norm(provided).replace(/ /g, "-") || provided;
  const label = norm(w.word || "mot").replace(/ /g, "-") || "mot";
  // ID volontairement fondé sur le mot et la nature, pas sur la définition :
  // une correction éditoriale du JSON ne doit pas effacer la progression.
  const signature = [w.word, w.nature || ""].join("|");
  return `${label}-${hashString(signature)}`;
}

function shuffle(a) {
  const arr = [...a];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function placeAnswerAt(answer, distractors, index) {
  const options = (distractors || []).slice(0, 3);
  const safeIndex = Math.max(0, Math.min(3, index || 0));
  options.splice(safeIndex, 0, answer);
  return options;
}

const addDays = (n) => {
  const d = new Date();
  d.setDate(d.getDate() + n);
  return d.toISOString();
};

const addMin = (n) => {
  const d = new Date();
  d.setMinutes(d.getMinutes() + n);
  return d.toISOString();
};

function localDateKey(d = new Date()) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function inferNature(w) {
  const d = String(w.definition || "").trimStart();
  if (/^verbe pronominal/i.test(d)) return "Verbe pronominal";
  if (/^locution/i.test(d)) return "Locution";
  if (/^expression/i.test(d)) return "Expression";
  if (/^adjectif/i.test(d)) return "Adjectif";
  if (/^adverbe/i.test(d)) return "Adverbe";
  if (/^verbe\b/i.test(d)) return "Verbe";
  if (/^nom et adjectif/i.test(d)) return "Nom/Adj";
  if (/^nom/i.test(d)) return "Nom";
  const n = String(w.nature || "").trim().toLowerCase();
  if (n.includes("verbe pronominal")) return "Verbe pronominal";
  if (n.includes("locution")) return "Locution";
  if (n.includes("expression")) return "Expression";
  if (n.includes("adjectif")) return "Adjectif";
  if (n.includes("adverbe")) return "Adverbe";
  if (n.includes("verbe")) return "Verbe";
  if (n.includes("nom")) return "Nom";
  return "Mot";
}

function inferTheme(w) {
  const t = norm([w.word, w.definition, w.definition_compacte, w.compact].join(" "));
  if (/sophisme|argument|raisonnement|logique|preuve|biais|abduction|heuristique|falsifiab|aporie|premisse|whataboutisme|homme de paille/.test(t)) return "Argumentation";
  if (/recit|narrat|figure|rhetorique|litteraire|style|ironie|anaphore|analepse|anthologie|antiphrase/.test(t)) return "Littérature";
  if (/religion|foi|divin|spirit|sacre|mystique|bigot|breviaire|anachorete/.test(t)) return "Spiritualité";
  if (/ecolog|ecosysteme|vivant|climat|polluant|biotope|biosphere|biome|anthropocene/.test(t)) return "Écologie";
  if (/droit|justice|contrat|pouvoir|politique|institution|coercit|delit/.test(t)) return "Droit & Politique";
  if (/medecine|psycholog|organe|volonte|neuro|cerveau|catatonie|atrophie|apathie|aboulie/.test(t)) return "Psychologie";
  if (/philosophie|conscience|doctrine|morale|epistem|ethique|ontolog|axiologie|empirisme|ataraxie|aporie/.test(t)) return "Philosophie";
  return "Vocabulaire";
}

function inferLevel(w) {
  const len = (w.word || "").length;
  if (len > 14) return "Avancé";
  if (len > 9) return "Intermédiaire";

}

function isGeneric(e) {
  return !e || /Dans son article|Le chroniqueur emploie|Dans l'analyse|peut servir à décrire|Le texte emploie|Dans le passage|Le passage emploie|Dans l'article|Dans le récit|Le journaliste emploie|On parle d['\u2019]?«?/i.test(e);
}

function makeContextSentence(w) { return ""; }

function normalizeConfusions(value) {
  if (!value) return [];
  const arr = Array.isArray(value) ? value : [value];
  return arr.map(item => {
    if (typeof item === "string") return { word: item.trim(), difference: "", compact: "", definition: "" };
    if (!item || typeof item !== "object") return null;
    return {
      word: String(item.word || item.mot || item.term || "").trim(),
      difference: String(item.difference || item.nuance || item.note || item.explanation || "").trim(),
      compact: String(item.definition_courte || item.definition_compacte || item.compact || "").trim(),
      definition: String(item.definition || item.full_definition || "").trim(),
    };
  }).filter(x => x && x.word);
}

function tokenSet(s) {
  return new Set(norm(s).split(" ").filter(x => x.length > 3));
}

function lexicalOverlap(a, b) {
  const ta = tokenSet([a.compact, a.definition, a.theme].join(" "));
  const tb = tokenSet([b.compact, b.definition, b.theme].join(" "));
  if (!ta.size || !tb.size) return 0;
  let n = 0;
  ta.forEach(t => { if (tb.has(t)) n++; });
  return n / Math.max(ta.size, tb.size);
}

function findWordByLabel(words, label) {
  const wanted = norm(label);
  return (words || []).find(w => norm(w.word) === wanted) || null;
}

function enrichConfusionItem(item, word, words) {
  const existing = findWordByLabel(words, item.word);
  const compact = item.compact || existing?.compact || "";
  const definition = item.definition || existing?.definition || "";
  const difference = item.difference || "";
  if (!difference && !compact && !definition) return null;
  return {
    id: existing?.id || `virtual-${norm(item.word)}`,
    word: item.word,
    difference,
    compact,
    definition,
    theme: existing?.theme || word.theme,
    nature: existing?.nature || word.nature,
  };
}

function inferredConfusions(word, words, limit = 3) {
  return (words || [])
    .filter(w => w.id !== word.id)
    .map(w => {
      const overlap = lexicalOverlap(word, w);
      const score = (w.theme === word.theme ? 2 : 0) + (w.nature === word.nature ? 0.5 : 0) + overlap;
      return { ...w, score, overlap };
    })
    .filter(w => w.score >= 2 || w.overlap >= 0.18)
    .sort((a,b)=>b.score-a.score)
    .slice(0, limit)
    .map(w => ({
      id: w.id,
      word: w.word,
      difference: "",
      compact: w.compact || "",
      definition: w.definition || "",
      theme: w.theme,
      nature: w.nature,
    }))
    .filter(x => x.compact || x.definition);
}

function getConfusionItems(word, words, limit = 3) {
  const explicit = normalizeConfusions(word.confusions || [])
    .map(item => enrichConfusionItem(item, word, words || []))
    .filter(Boolean);
  if (explicit.length) return explicit.slice(0, limit);
  return inferredConfusions(word, words, limit);
}

function uniqueWordOptions(items) {
  const seen = new Set();
  return (items || []).filter(item => {
    if (!item || !item.id) return false;
    const key = item.id || norm(item.word);
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function smartDistractors(answer, words, limit = 3) {
  const pool = (words || []).filter(w => w && w.id !== answer.id);
  const confusionLabels = getConfusionItems(answer, words || [], 8).map(item => norm(item.word));
  const scored = pool.map(w => {
    const sameTheme = w.theme && answer.theme && w.theme === answer.theme;
    const sameNature = w.nature && answer.nature && w.nature === answer.nature;
    const explicitConfusion = confusionLabels.includes(norm(w.word));
    const overlap = lexicalOverlap(answer, w);
    const levelGap = Math.abs((parseInt(w.level, 10) || 0) - (parseInt(answer.level, 10) || 0));
    let score = 0;
    if (explicitConfusion) score += 100;
    if (sameTheme) score += 35;
    if (sameNature) score += 18;
    score += overlap * 25;
    score -= Math.min(levelGap, 3) * 2;
    score += Math.random() * 4;
    return { w, score };
  });
  const strong = scored
    .filter(x => x.score >= 18)
    .sort((a,b)=>b.score-a.score)
    .map(x=>x.w);
  const fallback = shuffle(pool);
  return uniqueWordOptions([...strong, ...fallback]).slice(0, limit);
}

function inferFigureFamily(w) {
  const t = norm([w.word, w.definition_courte, w.definition, w.example].join(" "));
  if (/comparaison|metaphore|personnification|allegorie|symbole|image|ressemblance/.test(t)) return "Figures d'image";
  if (/metonymie|synecdoque|periphrase|antonomase|catachrese|allusion|remplacement|designe/.test(t)) return "Substitution";
  if (/hyperbole|adynaton|auxese|tapinose|amplification|exageration|intensite|rabaisse/.test(t)) return "Intensité";
  if (/litote|euphemisme|attenu/.test(t)) return "Atténuation";
  if (/ironie|antiphrase|preterition|reticence|aposiopese|sous entendu|contraire/.test(t)) return "Ironie & implicite";
  if (/paradoxe|oxymore|antithese|opposition|contradictoire|contraste/.test(t)) return "Opposition";
  if (/chiasme|antimetabole|parallelisme|isocolon|hypozeuxe|construction|structure|syntaxe|abba/.test(t)) return "Construction";
  if (/anaphore|epiphore|repetition|polyptote|antanaclase|reprise/.test(t)) return "Répétition";
  if (/allitération|assonance|paronomase|sonorite|phonique|sonore/.test(t)) return "Sonorités";
  if (/ellipse|zeugma|asyndete|polysyndete|accumulation|enumeration|gradation/.test(t)) return "Rythme & syntaxe";
  return "Figures de style";
}

function buildWord(w, kind = "vocab") {

  // de definition_courte : le vocabulaire général peut aussi utiliser ce champ.
  const isFigure = kind === "figure" || w.kind === "figure" || w.type === "figure";
const compact = w.definition_compacte || w.definition_courte || w.compact || w.definition || "";

const rawExamples = [
 {
  example: String(w.example_1 || w.example || "").trim(),
  cloze: String(w.example_cloze_1 || w.example_cloze || w.cloze || w.phrase_trouee || "").trim(),
  type: String(w.example_type_1 || w.example_type || "").trim(),
  clozeType: String(w.example_cloze_type_1 || w.example_cloze_type || "").trim()
 },
 {
  example: String(w.example_2 || "").trim(),
  cloze: String(w.example_cloze_2 || "").trim(),
  type: String(w.example_type_2 || "").trim(),
  clozeType: String(w.example_cloze_type_2 || "").trim()
 }
].filter(item => item.example && item.example.length > 20 && !isGeneric(item.example));

const fallbackExample = String(w.example || "").trim();

const examples = rawExamples.length
 ? rawExamples
 : [{
  example: fallbackExample || makeContextSentence({ word: w.word, compact }),
  cloze: String(w.cloze || w.example_cloze || w.phrase_trouee || "").trim(),
  type: String(w.example_type || "").trim(),
  clozeType: String(w.example_cloze_type || "").trim()
 }];

const hasGoodExample = rawExamples.length > 0 || (fallbackExample.length > 20 && !isGeneric(fallbackExample));
  const baseId = stableWordId(w);
  const finalId = isFigure && !String(baseId).startsWith("figure-") ? `figure-${baseId}` : baseId;
  return {
    id: finalId,
    kind: isFigure ? "figure" : "vocab",
    word: String(w.word || "").trim(),
    definition: String(w.definition || ""),
    compact: String(compact || ""),
    examples,

example: examples[0]?.example || makeContextSentence({ word: w.word, compact }),

hasRealExample: hasGoodExample,

cloze: examples[0]?.cloze || null,

exampleType: examples[0]?.type || "",

clozeType: examples[0]?.clozeType || "",
    
    confusions: normalizeConfusions(w.confusions || w.mots_proches || w.motsProches || w.near || []),
    memoryTip: String(w.memory_tip || w.mnemonic || w.astuce || ""),
    etymology: String(w.etymology || w.etymologie || ""),
    register: String(w.register || w.registre || ""),
    theme: isFigure ? inferFigureFamily(w) : inferTheme(w),
    nature: inferNature(w),
    level: isFigure ? "Figure" : inferLevel(w)
  };
}

function buildWords(rawWords, kind = "vocab") {
  const seen = new Map();
  return rawWords
    .filter(w => w && typeof w.word === "string" && w.word.trim())
    .map(w => {
      const built = buildWord(w, kind);
      const n = seen.get(built.id) || 0;
      seen.set(built.id, n + 1);
      return n === 0 ? built : { ...built, id: `${built.id}-${n + 1}` };
    });
}

function validateVocabArray(arr) {
  if (!Array.isArray(arr) || arr.length === 0) return "Le JSON doit être un tableau non vide.";
  const badIndex = arr.findIndex(item => !item || typeof item.word !== "string" || !item.word.trim());
  if (badIndex >= 0) return `Entrée invalide à l'index ${badIndex} : champ "word" requis.`;
  return null;
}

function extractProfilePayload(data) {
  if (!data || typeof data !== "object" || Array.isArray(data)) return null;
  const payload = data.profileData && typeof data.profileData === "object" ? data.profileData : data;
  if (!payload || typeof payload !== "object") return null;
  if (payload.progress && payload.meta) return payload;
  if (payload.profileData && payload.profileData.progress && payload.profileData.meta) return payload.profileData;
  return null;
}

function uniqueById(arr) {
  return [...new Map(arr.map(w => [w.id, w])).values()];
}

function dedupeWordKey(w) {
  return `${w.kind || "vocab"}:${norm(w.word || "")}`;
}

function mergeWordsPriority(groups) {
  const items = [];
  const seenIds = new Set();
  const seenWords = new Set();
  const skipped = [];
  groups.forEach(group => {
    (group.items || []).forEach(item => {
      const key = dedupeWordKey(item);
      if (!key.split(":")[1] || seenIds.has(item.id) || seenWords.has(key)) {
        skipped.push({ ...item, sourceId: group.sourceId || item.sourceId || "", sourceLabel: group.sourceLabel || item.sourceLabel || "" });
        return;
      }
      seenIds.add(item.id);
      seenWords.add(key);
      items.push({ ...item, sourceId: group.sourceId || item.sourceId || "", sourceLabel: group.sourceLabel || item.sourceLabel || "" });
    });
  });
  return { items, skipped };
}

function escapeRegExp(s) {
  return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}
function pickRandomExample(word) {
 const examples = Array.isArray(word.examples)
  ? word.examples.filter(item => item && item.example)
  : [];

 if (examples.length) {
  return examples[Math.floor(Math.random() * examples.length)];
 }

 return {
  example: word.example || "",
  cloze: word.cloze || word.example_cloze || word.phrase_trouee || "",
  type: word.exampleType || word.example_type || "",
  clozeType: word.clozeType || word.example_cloze_type || ""
 };
}

function getExampleText(word, cloze = false) {
 const picked = pickRandomExample(word);

 if (!cloze) {
  return picked.example || word.example || "";
 }

 if (picked.cloze) {
  return picked.cloze;
 }

 return blankSentence({
  ...word,
  example: picked.example || word.example || "",
  cloze: picked.cloze || word.cloze || ""
 });
}

function textContainsAnswer(text, word) {
  const normalizedText = norm(text);
  if (!normalizedText) return false;
  return acceptedAnswers(word)
    .filter(answer => answer.length >= 3)
    .some(answer => new RegExp(`(^| )${escapeRegExp(answer)}( |$)`).test(normalizedText));
}

function getReviewExamplePrompt(word) {
  const prompt = getExampleText(word, true);
  if (!textContainsAnswer(prompt, word)) return prompt;
  return blankSentence({ ...word, example: prompt, cloze: "" });
}

function blankSentence(w) {
  if (w.cloze && String(w.cloze).includes("________")) return w.cloze;
  if (w.cloze && String(w.cloze).includes("[…]")) return w.cloze;
  const e = String(w.example || "");
  const forms = [w.word, String(w.word || "").replace(/^\(Se\)\s*/i, "se ")]
    .map(x => String(x || "").trim())
    .filter(Boolean);

  for (const form of forms) {
    const re = new RegExp(escapeRegExp(form), "i");
    if (re.test(e)) return e.replace(re, "________");
  }
  return `${e} (________)`;
}

function acceptedAnswers(word) {
  const base = norm(word.word);
  const variants = new Set([base]);
  variants.add(base.replace(/^se /, "").trim());
  variants.add(base.replace(/^s /, "").trim());
  variants.add(base.replace(/^le /, "").trim());
  variants.add(base.replace(/^la /, "").trim());
  variants.add(base.replace(/^l /, "").trim());
  variants.add(norm(String(word.word || "").replace(/^\(Se\)\s*/i, "")));
  return [...variants].filter(Boolean);
}

function answerMatches(input, word) {
  const n = norm(input);
  return acceptedAnswers(word).includes(n);
}

// ─── STORAGE & PROFILE ────────────────────────────────────────────────────────
// Les clés sans suffixe de version sont volontaires : elles permettent de publier
// de nouvelles versions de l'app sans rendre invisible la progression existante.
const STORE_PROFILE   = "atelier_vocab_profile";
const STORE_PROGRESS  = "atelier_vocab_progress";
const STORE_WORDS     = "atelier_vocab_words";
const STORE_FIGURES   = "atelier_vocab_figures";
const STORE_SOURCES   = "atelier_vocab_sources";
const STORE_SOURCE_CACHE = "atelier_vocab_source_cache";
const STORE_MILESTONE = "atelier_vocab_milestone";
const STORE_DAILY     = "atelier_vocab_daily_done";
const STORE_ACTIVITY  = "atelier_vocab_activity";
const PROFILE_SCHEMA_VERSION = 1;

const LEGACY_PROGRESS_KEYS = [
  "atelier_vocab_progress_v4",
  "atelier_vocab_progress_v5",
  "atelier_vocab_progress_v6",
  "atelier_vocab_progress"
];
const LEGACY_WORD_KEYS = ["atelier_vocab_words_v4", "atelier_vocab_words_v5", "atelier_vocab_words_v6", "atelier_vocab_words"];
const LEGACY_FIGURE_KEYS = ["atelier_vocab_figures_v1", "atelier_vocab_figures"];
const LEGACY_MILESTONE_KEYS = ["atelier_vocab_milestone_v4", "atelier_vocab_milestone_v5", "atelier_vocab_milestone"];
const LEGACY_ACTIVITY_KEYS = ["atelier_vocab_activity_v1", "atelier_vocab_activity"];
const LEGACY_DAILY_KEYS = ["atelier_vocab_daily_done_v1", "atelier_vocab_daily_done"];

const EMPTY_PROGRESS = Object.freeze({ seen:0, correct:0, wrong:0, mastery:0, recog:0, prod:0, streak:0, next:null });
const DEFAULT_META = Object.freeze({ xp:0, streak:0, lastDay:null });

function safeParseJSON(value, fallback = null) {
  try { return value ? JSON.parse(value) : fallback; }
  catch { return fallback; }
}

function normalizeLoadedProgress(data) {
  if (!data || typeof data !== "object") return { progress:{}, meta:{...DEFAULT_META} };
  const source = data.profileData && typeof data.profileData === "object" ? data.profileData : data;
  return {
    progress: source.progress && typeof source.progress === "object" ? source.progress : {},
    meta: { ...DEFAULT_META, ...(source.meta && typeof source.meta === "object" ? source.meta : {}) }
  };
}

function defaultProfile() {
  return {
    type: "atelier-vocab-profile",
    schemaVersion: PROFILE_SCHEMA_VERSION,
    profile: {
      id: `profile-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,
      name: "Profil local",
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString()
    },
    progress: {},
    meta: { ...DEFAULT_META },
    sources: [],
    activity: {},
    milestones: [],
    dailyDone: null,
    sourceCache: {}
  };
}

function loadProfile() {
  const stored = safeParseJSON(localStorage.getItem(STORE_PROFILE));
  if (stored && typeof stored === "object") {
    return {
      ...defaultProfile(),
      ...stored,
      profile: { ...defaultProfile().profile, ...(stored.profile || {}) },
      meta: { ...DEFAULT_META, ...(stored.meta || {}) },
      progress: stored.progress && typeof stored.progress === "object" ? stored.progress : {},
      sources: Array.isArray(stored.sources) ? stored.sources : [],
      activity: stored.activity && typeof stored.activity === "object" ? stored.activity : {},
      milestones: Array.isArray(stored.milestones) ? stored.milestones : [],
      sourceCache: stored.sourceCache && typeof stored.sourceCache === "object" ? stored.sourceCache : {}
    };
  }
  return defaultProfile();
}

function saveProfile(profile) {
  try {
    const next = {
      ...defaultProfile(),
      ...profile,
      schemaVersion: PROFILE_SCHEMA_VERSION,
      profile: { ...(profile.profile || defaultProfile().profile), updatedAt: new Date().toISOString() }
    };
    localStorage.setItem(STORE_PROFILE, JSON.stringify(next));
    return true;
  } catch { return false; }
}

function updateProfilePatch(patch) {
  const current = loadProfile();
  return saveProfile({ ...current, ...patch });
}

function findFirstStoredJSON(keys, validator = null) {
  for (const key of keys) {
    const parsed = safeParseJSON(localStorage.getItem(key));
    if (parsed && (!validator || validator(parsed))) return parsed;
  }
  return null;
}

function loadProgress() {
  const hasStoredProfile = !!localStorage.getItem(STORE_PROFILE);
  const profile = loadProfile();
  if (hasStoredProfile) {
    return normalizeLoadedProgress(profile);
  }
  const legacy = findFirstStoredJSON(LEGACY_PROGRESS_KEYS, x => x && typeof x === "object");
  const normalized = normalizeLoadedProgress(legacy);
  if (legacy) {
    updateProfilePatch({ progress: normalized.progress, meta: normalized.meta });
    try { localStorage.setItem(STORE_PROGRESS, JSON.stringify(normalized)); } catch {}
  }
  return normalized;
}

function saveProgress(s) {
  const normalized = normalizeLoadedProgress(s);
  try { localStorage.setItem(STORE_PROGRESS, JSON.stringify(normalized)); } catch {}
  return updateProfilePatch({ progress: normalized.progress, meta: normalized.meta });
}

function compactItemForStorage(w) {
  const shortDef = w.definition_courte || w.definition_compacte || w.compact || "";
  return {
    id: w.id || "",
    sourceId: w.sourceId || "",
    word: w.word,
    nature: w.nature || "",
    definition: w.definition || "",
    definition_courte: shortDef,
    definition_compacte: shortDef,
    example: w.example || "",
    examples: Array.isArray(w.examples) ? w.examples : [],

example_1: w.example_1 || w.examples?.[0]?.example || w.example || "",

example_cloze_1: w.example_cloze_1 || w.examples?.[0]?.cloze || w.example_cloze || w.cloze || "",

example_2: w.example_2 || w.examples?.[1]?.example || "",

example_cloze_2: w.example_cloze_2 || w.examples?.[1]?.cloze || "",
    example_type: w.example_type || "",
    example_cloze: w.example_cloze || w.cloze || w.phrase_trouee || "",
    example_cloze_type: w.example_cloze_type || "",
    cloze: w.cloze || w.example_cloze || w.phrase_trouee || "",
    confusions: w.confusions || w.mots_proches || w.motsProches || [],
    memory_tip: w.memory_tip || w.mnemonic || w.astuce || "",
    etymology: w.etymology || w.etymologie || "",
    register: w.register || w.registre || "",
    theme: w.theme || ""
  };
}

function loadCustomWords() {
  const current = safeParseJSON(localStorage.getItem(STORE_WORDS));
  if (Array.isArray(current)) return current;
  const legacy = findFirstStoredJSON(LEGACY_WORD_KEYS, Array.isArray);
  if (Array.isArray(legacy)) {
    try { localStorage.setItem(STORE_WORDS, JSON.stringify(legacy)); } catch {}
    return legacy;
  }
  return null;
}

function saveCustomWords(arr) {
  try {
    const compact = arr.map(compactItemForStorage);
    localStorage.setItem(STORE_WORDS, JSON.stringify(compact));

function loadCustomFigures() {
  const current = safeParseJSON(localStorage.getItem(STORE_FIGURES));
  if (Array.isArray(current)) return current;
  const legacy = findFirstStoredJSON(LEGACY_FIGURE_KEYS, Array.isArray);
  if (Array.isArray(legacy)) {
    try { localStorage.setItem(STORE_FIGURES, JSON.stringify(legacy)); } catch {}
    return legacy;
  }
  return null;
}

function saveCustomFigures(arr) {

    const compact = arr.map(compactItemForStorage);
    localStorage.setItem(STORE_FIGURES, JSON.stringify(compact));

  } catch { return false; }
}

function normalizeRawGistUrl(url) {
  let u = String(url || "").trim();
  if (!u) return "";
  u = u.replace(/\.js(\?.*)?$/, "");
  const gistMatch = u.match(/^https:\/\/gist\.github\.com\/([^\/]+)\/([a-f0-9]+)(?:\/.*)?$/i);
  if (gistMatch) return `https://gist.githubusercontent.com/${gistMatch[1]}/${gistMatch[2]}/raw/`;
  return u;
}

function sourceIdFromUrl(url) {
  return `source-${hashString(normalizeRawGistUrl(url))}`;
}

function normalizeVocabSource(raw) {
  if (!raw || typeof raw !== "object") return null;
  const url = normalizeRawGistUrl(raw.url || raw.rawUrl || raw.href || "");
  if (!url) return null;
  const id = raw.id || sourceIdFromUrl(url);
  return {
    id,
    type: "vocab",
    label: String(raw.label || raw.name || "Source vocabulaire").trim() || "Source vocabulaire",
    url,
    enabled: raw.enabled !== false,
    createdAt: raw.createdAt || new Date().toISOString(),
    lastLoadedAt: raw.lastLoadedAt || null,
    lastError: raw.lastError || null
  };
}

function loadExtraSources() {
  const profile = loadProfile();
  const fromProfile = Array.isArray(profile.sources) ? profile.sources.map(normalizeVocabSource).filter(Boolean) : [];
  const fromStore = safeParseJSON(localStorage.getItem(STORE_SOURCES), []);
  const rawSources = fromProfile.length ? fromProfile : (Array.isArray(fromStore) ? fromStore.map(normalizeVocabSource).filter(Boolean) : []);
  const seen = new Set();
  const out = [];
  rawSources.forEach(src => {
    const key = normalizeRawGistUrl(src.url);
    if (seen.has(key)) return;
    seen.add(key);
    out.push(src);
  });
  if (out.length && !fromProfile.length) updateProfilePatch({ sources: out });
  return out;
}

function saveExtraSources(sources) {
  const normalized = (sources || []).map(normalizeVocabSource).filter(Boolean);
  try { localStorage.setItem(STORE_SOURCES, JSON.stringify(normalized)); } catch {}
  updateProfilePatch({ sources: normalized });
  return normalized;
}

function loadSourceCache() {
  const profile = loadProfile();
  if (profile.sourceCache && Object.keys(profile.sourceCache).length) return profile.sourceCache;
  const cache = safeParseJSON(localStorage.getItem(STORE_SOURCE_CACHE), {});
  return cache && typeof cache === "object" ? cache : {};
}

function saveSourceCache(cache) {
  try { localStorage.setItem(STORE_SOURCE_CACHE, JSON.stringify(cache || {})); } catch {}
  updateProfilePatch({ sourceCache: cache || {} });
}

function loadSeenMilestones() {
  const profile = loadProfile();
  if (Array.isArray(profile.milestones) && profile.milestones.length) return profile.milestones;
  const legacy = findFirstStoredJSON(LEGACY_MILESTONE_KEYS, Array.isArray) || [];
  if (legacy.length) updateProfilePatch({ milestones: legacy });
  return legacy;
}

function saveSeenMilestone(key) {
  try {
    const s = loadSeenMilestones();
    if (!s.includes(key)) {
      const next = [...s, key];
      localStorage.setItem(STORE_MILESTONE, JSON.stringify(next));
      updateProfilePatch({ milestones: next });
    }

}

function loadDailyDone() {
  try {
    const profile = loadProfile();
    if (profile.dailyDone) return profile.dailyDone === localDateKey();
    for (const key of LEGACY_DAILY_KEYS) {
      const value = localStorage.getItem(key);
      if (value) return value === localDateKey();
    }
    return false;
  } catch { return false; }
}

function saveDailyDone() {
  try {
    const key = localDateKey();
    localStorage.setItem(STORE_DAILY, key);
    updateProfilePatch({ dailyDone: key });
  } catch {}
}

function clearDailyDone() {

    updateProfilePatch({ dailyDone: null });
  } catch {}
}

function loadActivity() {
  const profile = loadProfile();
  const stored = safeParseJSON(localStorage.getItem(STORE_ACTIVITY), {});
  const legacy = findFirstStoredJSON(LEGACY_ACTIVITY_KEYS, x => x && typeof x === "object") || {};
  const merged = {
    ...(legacy && typeof legacy === "object" ? legacy : {}),
    ...(stored && typeof stored === "object" ? stored : {}),
    ...(profile.activity && typeof profile.activity === "object" ? profile.activity : {})
  };
  if (Object.keys(merged).length) {
    try { localStorage.setItem(STORE_ACTIVITY, JSON.stringify(merged)); } catch {}
    updateProfilePatch({ activity: merged });
  }
  return merged;
}

function saveActivity(data) {
  try {
    localStorage.setItem(STORE_ACTIVITY, JSON.stringify(data));
    updateProfilePatch({ activity: data });
  } catch {}
}

function recordActivity(rating, mode, customXp) {
  const key = localDateKey();
  const data = loadActivity();
  const day = data[key] || { answers:0, correct:0, xp:0, modes:{} };
  day.answers += 1;
  if (rating !== "again") day.correct += 1;
  day.xp += (typeof customXp === "number") ? customXp : (rating === "again" ? 0 : 10);
  day.modes[mode || "recog"] = (day.modes[mode || "recog"] || 0) + 1;
  data[key] = day;
  saveActivity(data);
}

function awardXpBonus(state, amount, mode = "bonus") {
  if (!amount) return state;
  const ns = { ...state, meta:{ ...DEFAULT_META, ...(state.meta || {}) } };
  ns.meta.xp = (ns.meta.xp || 0) + amount;
  const key = localDateKey();
  const data = loadActivity();
  const day = data[key] || { answers:0, correct:0, xp:0, modes:{} };
  day.xp = (day.xp || 0) + amount;
  day.modes[mode] = (day.modes[mode] || 0) + 1;
  data[key] = day;
  saveActivity(data);
  saveProgress(ns);
  return ns;
}

function recentActivityDays(days = 21) {
  const data = loadActivity();
  const out = [];
  const base = new Date();
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(base);
    d.setDate(base.getDate() - i);
    const key = localDateKey(d);
    out.push({ key, date: d, ...(data[key] || { answers:0, correct:0, xp:0, modes:{} }) });
  }
  return out;
}

function cleanProgressForWords(state, words) {
  const valid = new Set(words.map(w => w.id));
  const progress = {};
  for (const [id, p] of Object.entries(state.progress || {})) {
    if (valid.has(id)) progress[id] = p;
  }
  return { ...state, progress };
}

// ─── SPACED REPETITION ────────────────────────────────────────────────────────
function readP(state, id) {
  return (state && state.progress && state.progress[id]) || EMPTY_PROGRESS;
}

function isDue(state, w) {
  const x = readP(state, w.id);
  return !!(x.next && new Date(x.next) <= new Date());
}

function getRate(state, w) {
  const x = readP(state, w.id);
  const t = (x.correct || 0) + (x.wrong || 0);
  return t ? Math.round(((x.correct || 0) / t) * 100) : 0;
}

function wordStatus(state, w) {
  const x = readP(state, w.id);
  if (!x.seen) return "Nouveau";
  if ((x.wrong || 0) >= 2 && getRate(state, w) < 70) return "Fragile";
  if (isDue(state, w)) return "À revoir";
  if ((x.mastery || 0) >= 5 && (x.prod || 0) >= 2 && getRate(state, w) >= 75) return "Maîtrisé";
  return "En cours";
}

function gradeWord(state, id, rating, mode = "recog", customXp) {
  const ns = { ...state, progress:{ ...(state.progress || {}) } };
  const x = { ...EMPTY_PROGRESS, ...readP(ns, id) };
  ns.progress[id] = x;

  x.seen = (x.seen || 0) + 1;

  if (rating === "again") {
    x.wrong = (x.wrong || 0) + 1;
    x.mastery = Math.max(0, (x.mastery || 0) - 1);
    x.streak = 0;
    x.next = addMin(20);
  } else {
    x.correct = (x.correct || 0) + 1;
    x.streak = (x.streak || 0) + 1;

    if (mode === "prod") x.prod = Math.min(6, (x.prod || 0) + 1);
    else x.recog = Math.min(6, (x.recog || 0) + 1);

    if (rating === "hard") x.mastery = Math.min(6, (x.mastery || 0) + 0.5);
    if (rating === "good") x.mastery = Math.min(6, (x.mastery || 0) + 1);
    if (rating === "easy") x.mastery = Math.min(6, (x.mastery || 0) + 2);

    const masteryFloor = Math.floor(x.mastery || 0);
    const map = [1, 1, 2, 4, 7, 14, 30];
    x.next = addDays(rating === "hard" ? 1 : map[masteryFloor] || 14);
  }

  const today = new Date().toDateString();
  const meta = { ...DEFAULT_META, ...(ns.meta || {}) };
  if (meta.lastDay !== today) {
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    meta.streak = meta.lastDay === yesterday.toDateString() ? (meta.streak || 0) + 1 : 1;
    meta.lastDay = today;
  }
  const _xpD = (typeof customXp === "number") ? customXp : (rating === "again" ? 0 : 10); meta.xp = (meta.xp || 0) + _xpD;
  ns.meta = meta;
  recordActivity(rating, mode, customXp);
  saveProgress(ns);
  return ns;
}

function candidates(state, words, mode = "smart", n = 20, excludeIds = new Set()) {
  const usable = words.filter(w => !excludeIds.has(w.id));
  if (!usable.length) return [];

  if (mode === "new") {
    const unseen = usable.filter(w => readP(state, w.id).seen === 0);
    return shuffle(unseen.length ? unseen : usable).slice(0, n);
  }

  return usable.map(w => {
    const x = readP(state, w.id);
    let s = 0;
    if (!x.seen) s += 900;
    if (isDue(state, w)) s += 800;
    if (x.wrong) s += x.wrong * 90;
    if (mode === "production" && (x.prod || 0) < 2) s += 200;
    s -= (x.mastery || 0) * 35;
    s += Math.random() * 40;
    return { w, s };
  }).sort((a, b) => b.s - a.s).slice(0, n).map(o => o.w);
}

function getMotDuJour(words) {
  if (!words.length) return null;
  const day = Math.floor(Date.now() / (1000 * 60 * 60 * 24));
  const pool = words.filter(w => w.hasRealExample);
  const src = pool.length > 0 ? pool : words;
  return src[day % src.length];
}

function buildDailySession(state, words) {
  const discover = candidates(state, words, "new", 5);
  const discoverIds = new Set(discover.map(w => w.id));
  let review = candidates(state, words, "smart", 8, discoverIds);

  // Si le vocabulaire est très court, exclure les mots de découverte peut vider
  // les étapes Association/Contexte/Production. Dans ce cas, on réutilise le
  // même petit corpus plutôt que de bloquer la routine.
  if (!review.length && words.length) review = candidates(state, words, "smart", Math.min(8, words.length));

  const boss = uniqueById([...discover, ...review]).slice(0, Math.min(8, words.length));
  return { discover, review, boss };
}

  { key:"mastered100",check:(s,w)=>w.filter(x=>wordStatus(s,x)==="Maîtrisé").length>=100, icon:"🌟", text:"100 mots maîtrisés !" },

function checkMilestones(state, words) {
  const seen = loadSeenMilestones();
  for (const m of MILESTONES) {
    if (!seen.includes(m.key) && m.check(state, words)) {
      saveSeenMilestone(m.key);
      return m;
    }
  }
  return null;
}

                  <p style={{fontSize:14,fontWeight:800,color:C.text,margin:"0 0 3px"}}>{src.label}</p>
                  <p style={{fontSize:12,color:C.sub,margin:0,lineHeight:1.45,overflowWrap:"anywhere"}}>{src.url}</p>
                  <p style={{fontSize:11,color:src.lastError?C.red:C.ter,margin:"5px 0 0",lineHeight:1.4}}>
                    {src.lastError ? `Erreur : ${src.lastError}` : src.lastLoadedAt ? `Dernier chargement : ${new Date(src.lastLoadedAt).toLocaleString("fr-FR")}` : "Pas encore chargée"}
                  </p>
                </div>
                <div style={{display:"flex",gap:6,flexShrink:0,flexWrap:"wrap",justifyContent:"flex-end"}}>
                  <Btn label={src.enabled?"Désactiver":"Activer"} variant="ghost" small onClick={()=>onToggleSource(src.id)} />
                  <Btn label="Supprimer" variant="ghost" small onClick={()=>onRemoveSource(src.id)} />
                </div>
              </div>
            </div>
          ))}
        </div>

        {duplicateCount > 0 && (
          <p style={{fontSize:12,color:C.orange,lineHeight:1.45,margin:"12px 0 0"}}>{duplicateCount} doublon{duplicateCount>1?"s":""} ignoré{duplicateCount>1?"s":""} : seule la première entrée est comptabilisée.</p>
        )}
        <div style={{display:"flex",justifyContent:"flex-end",marginTop:16}}>
          <Btn label="Fermer" variant="primary" onClick={requestClose}/>
        </div>
      </div>
    </div>
  );
}

function ResetModal({open,onClose,onConfirm}) {
  if (!open) return null;
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",backdropFilter:"blur(8px)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100,padding:16}} onClick={onClose}>
      <div style={{background:C.solid,borderRadius:20,padding:28,maxWidth:380,width:"100%",boxShadow:"0 24px 64px rgba(0,0,0,0.25)"}} onClick={e=>e.stopPropagation()}>
        <h2 style={{fontSize:20,fontWeight:800,color:C.red,marginBottom:10}}>Réinitialiser la progression ?</h2>
        <p style={{fontSize:14,color:C.sub,lineHeight:1.6,marginBottom:20}}>Cela supprimera XP, maîtrise, dates, objectifs déjà affichés et statut de routine du jour. Le vocabulaire importé sera conservé.</p>
        <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
          <Btn label="Annuler" variant="ghost" onClick={onClose}/>
          <Btn label="Réinitialiser" variant="danger" onClick={onConfirm}/>
        </div>
      </div>
    </div>
  );
}

// ─── DAILY TAB ────────────────────────────────────────────────────────────────
const STEPS = ["Découverte", "Association", "Contexte", "Production", "Boss"];

function DailyTab({words,state,setState,onMilestone,onGoReview,onGoQuiz,onGoNuance}) {
  const motDuJour = useMemo(()=>getMotDuJour(words),[words]);
  const wordsSignature = useMemo(()=>words.map(w=>w.id).join("|"),[words]);
  const [session,setSession] = useState(()=>buildDailySession(state,words));
  const [step,setStep] = useState(0);
  const [idx,setIdx] = useState(0);
  const [hearts,setHearts] = useState(3);
  const [xpToday,setXpToday] = useState(0);
  const [done,setDone] = useState(()=>loadDailyDone());
  const [feedback,setFeedback] = useState(null);
  const [inputVal,setInputVal] = useState("");
  const [shown,setShown] = useState(false);
  const [log,setLog] = useState([]);
  const timerRef = useRef(null);
  const advancingRef = useRef(false);

  useEffect(() => {
    setSession(buildDailySession(state, words));
    setStep(0); setIdx(0); setHearts(3); setXpToday(0); setFeedback(null); setInputVal(""); setShown(false); setLog([]);
    advancingRef.current = false;
    setDone(loadDailyDone());
    return () => { if (timerRef.current) clearTimeout(timerRef.current); };
  }, [wordsSignature]);

  const sources = useMemo(() => {
    if (step === 0) return session.discover.slice(0,5);
    if (step === 4) return session.boss.slice(0,8);
    return session.review.slice(0,8);
  }, [step, session]);

  const current = sources[idx];

  const finishRoutine = useCallback(() => {
    saveDailyDone();
    setDone(true);
  }, []);

  const advance = useCallback((ok, mode="recog") => {
    if (!current || feedback || advancingRef.current) return;
    advancingRef.current = true;
    let _dailyXp = 0;
    if (ok) {
      _dailyXp = calcXP(state, current, step === 0 ? "discover" : mode);
    }
    const ns = gradeWord(state, current.id, ok ? "good" : "again", mode, ok ? _dailyXp : 0);
    setState(ns);
    if (ok) setXpToday(x => x + _dailyXp); else setHearts(h => h - 1);
    setLog(l=>[...l,{word:current,ok}]);
    setFeedback(ok?"correct":"wrong");

    const m = checkMilestones(ns, words);
    if (m) onMilestone(m);

    timerRef.current = setTimeout(() => {
      setFeedback(null); setShown(false); setInputVal("");
      advancingRef.current = false;
      if (idx + 1 >= sources.length) {
        if (step + 1 >= STEPS.length) finishRoutine();
        else { setStep(s=>s+1); setIdx(0); }
      } else setIdx(i=>i+1);
    }, 600);
  }, [current, feedback, state, setState, words, onMilestone, idx, sources.length, step, finishRoutine]);

  if (done && log.length === 0) {
    return (
      <Card style={{textAlign:"center",padding:"40px 24px"}}>
        <div style={{fontSize:48,marginBottom:12}}>🌙</div>
        <h2 style={{fontSize:22,fontWeight:800,color:C.text,marginBottom:8}}>Routine du jour terminée</h2>
        <p style={{fontSize:14,color:C.sub,lineHeight:1.6}}>La session quotidienne est verrouillée pour éviter de fausser l'XP et la répétition espacée. Tu peux continuer dans Révision ou Quiz.</p>
      </Card>
    );
  }

  if (done) {
    const uniqueWords = [...new Map(log.map(e=>[e.word.id,e])).values()];
    const nOk = log.filter(e=>e.ok).length;
    const nWrong = log.filter(e=>!e.ok).length;
    const toReview = uniqueWords.filter(e=>!e.ok).map(e=>e.word);
    const mastered = uniqueWords.filter(e=>e.ok).map(e=>e.word);
    return (
      <div style={{display:"flex",flexDirection:"column",gap:14,animation:"fadeSlideIn 0.3s ease"}}>
        <div style={{textAlign:"center",padding:"28px 0 12px"}}>
          <div style={{fontSize:60,marginBottom:10}}>🎉</div>
          <h2 style={{fontSize:26,fontWeight:800,color:C.text,marginBottom:6}}>Routine terminée</h2>
          <p style={{color:C.sub,fontSize:15}}>+{xpToday} XP · {nOk} ✓ · {nWrong} ✗</p>
        </div>
        {mastered.length>0&&(
          <Card style={{padding:"14px 18px"}}>
            <p style={{fontSize:12,fontWeight:700,color:C.green,textTransform:"uppercase",letterSpacing:0.8,margin:"0 0 10px"}}>Bien mémorisés ({mastered.length})</p>
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              {mastered.map(w=><Pill key={w.id} label={w.word} color={C.green}/>) }
            </div>
          </Card>
        )}
        {toReview.length>0&&(
          <Card style={{padding:"14px 18px"}}>
            <p style={{fontSize:12,fontWeight:700,color:C.orange,textTransform:"uppercase",letterSpacing:0.8,margin:"0 0 10px"}}>À retravailler ({toReview.length})</p>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {toReview.map(w=>(
                <div key={w.id} style={{padding:"10px 12px",borderRadius:12,background:`${C.orange}08`,border:`1px solid ${C.orange}30`}}>
                  <p style={{fontWeight:700,color:C.text,fontSize:14,margin:"0 0 2px"}}>{w.word}</p>
                  <p style={{color:C.sub,fontSize:13,margin:0}}>{w.compact}</p>
                  {w.hasRealExample&&<p style={{color:C.sub,fontSize:12,fontStyle:"italic",margin:"4px 0 0",lineHeight:1.5}}>{w.example}</p>}
                </div>
              ))}
            </div>
          </Card>
        )}
        <Card style={{padding:"16px 18px",background:`${C.blue}08`}}>
          <p style={{fontSize:12,fontWeight:800,color:C.blue,textTransform:"uppercase",letterSpacing:0.8,margin:"0 0 6px"}}>Prochaine action recommandée</p>
          <p style={{fontSize:14,color:C.text,lineHeight:1.55,margin:"0 0 12px"}}>
            {toReview.length>0 ? "Revoir les mots ratés pendant 2 minutes, puis refaire un quiz court." : "Consolider avec un quiz court ou un exercice de nuance."}
          </p>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            {toReview.length>0 && <Btn label="Réviser" variant="primary" small onClick={onGoReview}/>} 
            <Btn label="Quiz" variant="ghost" small onClick={onGoQuiz}/>
            <Btn label="Nuance" variant="ghost" small onClick={onGoNuance}/>
          </div>
        </Card>
        <p style={{textAlign:"center",color:C.ter,fontSize:13}}>Reviens demain pour la prochaine routine.</p>
      </div>
    );
  }

  if (hearts <= 0) return (
    <div style={{textAlign:"center",padding:"48px 0"}}>
      <div style={{fontSize:56,marginBottom:16}}>💔</div>
      <h2 style={{fontSize:22,fontWeight:700,marginBottom:10,color:C.text}}>Session terminée</h2><p style={{fontSize:14,color:C.sub,lineHeight:1.6,marginBottom:20}}>Tes erreurs ont été ajoutées à tes révisions.</p>
      <div style={{display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap"}}>
        <Btn label="Rejouer" variant="primary" onClick={()=>{setHearts(3);setStep(0);setIdx(0);setLog([]);setFeedback(null);setInputVal("");setShown(false);advancingRef.current=false;setSession(buildDailySession(state,words));}}/>
        <Btn label="Réviser mes erreurs" variant="ghost" onClick={onGoReview}/>
      </div>
    </div>
  );

  if (!current) return (
    <div>
      {motDuJour && <MotDuJour word={motDuJour} state={state}/>} 
      <Card style={{textAlign:"center",padding:"40px 24px"}}>
        <p style={{color:C.sub,fontSize:16}}>Aucun mot disponible pour cette session.</p>
      </Card>
    </div>
  );

  const cardBg = feedback === "correct" ? `${C.green}14` : feedback === "wrong" ? `${C.red}10` : C.surface;

  return (
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      {step===0 && idx===0 && motDuJour && <MotDuJour word={motDuJour} state={state}/>} 

      <div style={{display:"flex",gap:8,alignItems:"center"}}>
        <div style={{flex:1,display:"flex",gap:4}}>
          {STEPS.map((s,i)=>(
            <div key={i} style={{flex:1,height:5,borderRadius:99,background:i<step?C.green:i===step?C.blue:"rgba(0,0,0,0.1)",transition:"background 0.3s"}}/>
          ))}
        </div>
        <span style={{fontSize:14,color:C.red,fontWeight:700,minWidth:52,textAlign:"right"}}>{"♥".repeat(Math.max(0,hearts))}{"♡".repeat(Math.max(0,3-hearts))}</span>
        <span style={{fontSize:14,color:C.orange,fontWeight:700}}>+{xpToday}</span>
      </div>
      <div style={{fontSize:12,color:C.sub,fontWeight:600,letterSpacing:0.8,textTransform:"uppercase"}}>{STEPS[step]} · {idx+1} / {sources.length}</div>

      <div className={`question-card ${feedback==="correct"?"feedback-correct":feedback==="wrong"?"feedback-wrong":""}`} style={{background:cardBg,backdropFilter:"blur(20px)",border:`1px solid ${C.border}`,borderRadius:22,padding:"26px 22px",transition:"background 0.4s ease",boxShadow:"0 4px 24px rgba(0,0,0,0.07)"}}>
        {step===0 && <StepDiscover key={`discover-${current.id}-${idx}`} word={current} words={words} shown={shown} setShown={setShown} onNext={()=>advance(true)} />}
        {step===1 && <StepChoice key={`association-${current.id}-${idx}`} word={current} words={words} mode="termToDefinition" onAnswer={ok=>advance(ok,"recog")} />}
        {step===2 && <StepContext key={`context-${current.id}-${idx}`} word={current} words={words} onAnswer={ok=>advance(ok,"prod")} />}
        {step===3 && <StepProd key={`production-${current.id}-${idx}`} word={current} inputVal={inputVal} setInputVal={setInputVal} onAnswer={ok=>advance(ok,"prod")} />}
        {step===4 && <StepChoice key={`boss-${current.id}-${idx}`} word={current} words={words} mode="mixed" onAnswer={ok=>advance(ok,"recog")} />}
      </div>
    </div>
  );
}

function StepDiscover({word,words,shown,setShown,onNext}) {
  return (
    <div>
      <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>
        <Pill label={word.nature} color={C.purple}/>
        <Pill label={word.theme} color={THEME_COLOR[word.theme]}/>
        <Pill label={word.level} color={C.sub}/>
      </div>
      <WordTitle>{word.word}</WordTitle>
      {!shown ? (
        <>
          <ExampleBlock word={word}/>
          <Btn label="Voir la définition" variant="primary" full onClick={()=>setShown(true)}/>
        </>
      ) : (
        <>
          <p style={{fontSize:18,color:C.text,fontWeight:700,marginBottom:6}}>{word.compact}</p>
          <p style={{fontSize:14,color:C.sub,lineHeight:1.65,marginBottom:12}}>{word.definition}</p>
          <ExampleBlock word={word}/>
          <ConfusionBlock word={word} words={words} compact />
          <Btn label="J'ai compris" variant="success" full onClick={onNext}/>
        </>
      )}
    </div>
  );
}

function StepChoice({word,words,mode,onAnswer}) {
  const [selected,setSelected] = useState(null);
  const timerRef = useRef(null);

  useEffect(() => {
    setSelected(null);
    if (timerRef.current) clearTimeout(timerRef.current);
  }, [word.id]);

  useEffect(() => () => {
    if (timerRef.current) clearTimeout(timerRef.current);
  }, []);

  const pool = useMemo(
    ()=>smartDistractors(word, words, 3),
    [word.id, words]
  );
  const options = useMemo(()=>shuffle([word,...pool]),[word,pool]);
  const showTerm = useMemo(
    ()=>mode==="termToDefinition" || (mode==="mixed" && Math.random()>0.5),
    [mode, word.id]
  );

  const handleClick = (o) => {
    if (selected) return;
    setSelected(o.id);
    const ok = o.id === word.id;
    if (ok) timerRef.current = setTimeout(()=>onAnswer(true), 650);
  };

  const getBtnStyle = (o) => {
    if (!selected) return {bg:C.solid,border:C.border,color:C.text,weight:500};
    if (o.id === word.id) return {bg:`${C.green}22`,border:C.green,color:C.text,weight:700};
    if (o.id === selected) return {bg:`${C.red}18`,border:C.red,color:C.sub,weight:500};
    return {bg:C.solid,border:C.border,color:C.ter,weight:500};
  };

  const wrong = selected && selected !== word.id;

  return (
    <div>
      <p style={{fontSize:12,color:C.sub,fontWeight:700,textTransform:"uppercase",letterSpacing:0.8,marginBottom:12}}>
        {showTerm?"Quelle est la définition ?":"Quel est le mot ?"}
      </p>
      <div className="word-title" style={{fontSize:showTerm?36:18,fontWeight:showTerm?800:500,color:C.text,marginBottom:18,letterSpacing:showTerm?-1.2:0,lineHeight:1.18}}>
        {showTerm?word.word:word.compact}
      </div>
      <div className="choice-grid">
        {options.map(o=>{
          const s = getBtnStyle(o);
          return (
            <button key={o.id} onClick={()=>handleClick(o)} disabled={!!selected} style={{
              padding:"13px 12px",borderRadius:14,border:`1.5px solid ${s.border}`,
              background:s.bg,textAlign:"left",cursor:selected?"default":"pointer",
              fontSize:13,fontWeight:s.weight,color:s.color,lineHeight:1.45,
              transition:"all 0.25s ease"

const QUIZ_SIZES = [5,10,15,20];

function buildNuanceQuestion(word, words) {
  const close = getConfusionItems(word, words, 5).map(item => {
    const existing = words.find(w => norm(w.word) === norm(item.word));
    if (existing) return existing;
    return {
      id:`virtual-${norm(item.word)}`,
      word:item.word,
      compact:item.difference || item.compact || item.definition || "Terme à comparer",
      definition:item.definition || item.compact || item.difference || "",
      theme:word.theme,
      nature:word.nature
    };
  });
  const fillers = words.filter(w => w.id !== word.id && !close.some(c => norm(c.word) === norm(w.word)) && w.theme === word.theme).slice(0, 6);
  const options = uniqueById([word, ...close, ...shuffle(fillers)]).slice(0, 4);
  while (options.length < Math.min(4, words.length)) {
    const candidate = shuffle(words.filter(w => w.id !== word.id && !options.some(o => o.id === w.id)))[0];
    if (!candidate) break;
    options.push(candidate);
  }
  return { prompt: getExampleText(word, true), answer: word, options: shuffle(options) };
}

function NuanceQuiz({words,state,setState,onMilestone,onBackToQuick}) {
  const [count,setCount] = useState(0);
  const [score,setScore] = useState(0);
  const [done,setDone] = useState(false);
  const [current,setCurrent] = useState(null);
  const [selected,setSelected] = useState(null);
  const askedRef = useRef(new Set());

  const getNext = useCallback(() => {
    const base = candidates(state, words, "smart", words.length, askedRef.current);
    return base.find(w => getConfusionItems(w, words, 3).length > 0) || base[0] || words[0];
  }, [state, words]);

  useEffect(()=>{ setCurrent(getNext()); setSelected(null); }, [getNext]);

  const q = useMemo(()=>current ? buildNuanceQuestion(current, words) : null, [current, words]);
  const maxQ = 8;

  const continueNext = () => {
    const next = count + 1;
    if (next >= maxQ) { setDone(true); return; }
    setCount(next);
    setSelected(null);
    setCurrent(getNext());
  };

  const answer = (o) => {
    if (selected || !current) return;
    setSelected(o.id);
    askedRef.current.add(current.id);
    const ok = o.id === current.id;
    const ns = gradeWord(state, current.id, ok ? "good" : "again", "nuance");
    setState(ns);
    const m = checkMilestones(ns, words);
    if (m) onMilestone(m);
    if (ok) setScore(s=>s+1);
  };

  if (!current || !q) return <Card style={{textAlign:"center",padding:"40px 24px",color:C.sub}}>Aucun mot disponible pour le mode nuance.</Card>;

  if (done) return (
    <Card style={{textAlign:"center",padding:"36px 24px"}}>
      <div style={{fontSize:52,marginBottom:12}}>{score>=6?"🎯":"🧭"}</div>
      <h2 style={{fontSize:24,fontWeight:850,color:C.text,marginBottom:8}}>Nuance : {score} / {maxQ}</h2>
      <p style={{fontSize:14,color:C.sub,lineHeight:1.55,margin:"0 0 20px"}}>Ce mode entraîne surtout le choix du mot juste parmi des termes proches.</p>
      <div style={{display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap"}}>
        <Btn label="Rejouer" variant="primary" onClick={()=>{askedRef.current=new Set();setCount(0);setScore(0);setDone(false);setSelected(null);setCurrent(getNext());}}/>
        <Btn label="Quiz classique" variant="ghost" onClick={onBackToQuick}/>
      </div>
    </Card>
  );

  const wrong = selected && selected !== current.id;
  return (
    <div style={{display:"flex",flexDirection:"column",gap:12,animation:"fadeSlideIn 0.25s ease"}}>
      <div style={{display:"flex",alignItems:"center",gap:12}}>
        <div style={{flex:1}}><Bar value={(count/maxQ)*100} color={C.indigo}/></div>
        <span style={{fontSize:13,color:C.sub,fontWeight:600,minWidth:50,textAlign:"right"}}>{count+1} / {maxQ}</span>
        <span style={{fontSize:13,color:C.green,fontWeight:700}}>✓ {score}</span>
      </div>
      <Card>
        <p style={{fontSize:12,color:C.indigo,fontWeight:800,textTransform:"uppercase",letterSpacing:0.8,margin:"0 0 10px"}}>Mode nuance</p>
        <div style={{background:`${C.indigo}08`,borderLeft:`4px solid ${C.indigo}`,borderRadius:"0 14px 14px 0",padding:"14px 16px",margin:"0 0 16px"}}>
          <p style={{fontSize:16,color:C.text,fontStyle:"italic",lineHeight:1.7,margin:0}}>{q.prompt}</p>
        </div>
        <p style={{fontSize:13,color:C.sub,lineHeight:1.5,margin:"0 0 12px"}}>Quel mot est le plus précis dans ce contexte ?</p>
        <div className="choice-grid">
          {q.options.map(o=>{
            let bg=C.solid,border=C.border,color=C.text,weight=650;
            if(selected) {
              if(o.id===current.id) {bg=`${C.green}22`;border=C.green;color=C.green;weight=800;}
              else if(o.id===selected) {bg=`${C.red}18`;border=C.red;color=C.red;}
              else color=C.ter;
            }
            return <button key={o.id} disabled={!!selected} onClick={()=>answer(o)} style={{padding:"13px 12px",borderRadius:14,border:`1.5px solid ${border}`,background:bg,textAlign:"left",cursor:selected?"default":"pointer",fontSize:14,fontWeight:weight,color,lineHeight:1.35,transition:"all 0.2s"}}>{o.word}</button>;
          })}
        </div>
        {selected && (
          <div style={{marginTop:14,animation:"fadeSlideIn 0.25s ease"}}>
            <p style={{fontSize:13,color:wrong?C.red:C.green,fontWeight:800,margin:"0 0 8px"}}>{wrong ? "À corriger" : "Correct"}</p>

            <ConfusionBlock word={current} words={words}/>

      prompt: figure.compact || figure.definition,
      helper: "Quelle figure correspond à cette définition ?",
      options,
      renderOption: f => f.word
    };

    prompt: figure.example,
    cloze: figure.cloze,
    helper: "Quelle figure est illustrée par cet exemple complet ?",
    options,

function buildFigureRoutine(state, figures, variant = "full") {
  const discoverCount = variant === "short" ? 2 : 3;
  const reviewCount = variant === "short" ? 5 : 6;
  const discover = candidates(state, figures, "new", discoverCount);
  const discoverIds = new Set(discover.map(f => f.id));
  let review = candidates(state, figures, "smart", reviewCount, discoverIds);
  if (review.length < reviewCount) review = uniqueById([...review, ...shuffle(figures).slice(0, reviewCount)]);
  return { discover, review, boss: candidates(state, figures, "smart", reviewCount) };
}

function FigureRoutine({figures,state,setState,onMilestone,onBack,variant="full"}) {
  const steps = variant === "short" ? ["Découverte", "Exemples"] : ["Découverte", "Exemples", "Définitions", "Boss"];
  const figuresSignature = useMemo(()=>figures.map(f=>f.id).join("|"),[figures]);
  const [session,setSession] = useState(()=>buildFigureRoutine(state,figures,variant));
  const [step,setStep] = useState(0);
  const [idx,setIdx] = useState(0);
  const [hearts,setHearts] = useState(3);
  const [xpSession,setXpSession] = useState(0);
  const [shown,setShown] = useState(false);
  const [selected,setSelected] = useState(null);
  const [done,setDone] = useState(false);
  const [log,setLog] = useState([]);
  const timerRef = useRef(null);
  const advancingRef = useRef(false);

  useEffect(() => {
    setSession(buildFigureRoutine(state,figures,variant));
    setStep(0); setIdx(0); setHearts(3); setXpSession(0); setShown(false); setSelected(null); setDone(false); setLog([]);
    advancingRef.current = false;
    return () => { if (timerRef.current) clearTimeout(timerRef.current); };
  }, [figuresSignature, variant]);

  const sources = useMemo(() => {
    if (steps[step] === "Découverte") return session.discover;
    if (steps[step] === "Boss") return session.boss;
    return session.review;
  }, [step, steps, session]);
  const current = sources[idx];
  const questionMode = steps[step] === "Définitions" ? "definition" : "identify";
  const q = useMemo(()=>current ? buildFigureQuestion(current, figures, questionMode) : null, [current, figures, questionMode]);

  const restart = useCallback(() => {
    if (timerRef.current) clearTimeout(timerRef.current);
    setSession(buildFigureRoutine(state,figures,variant));
    setStep(0); setIdx(0); setHearts(3); setXpSession(0); setShown(false); setSelected(null); setDone(false); setLog([]);
    advancingRef.current = false;
  }, [state, figures, variant]);

  const advance = useCallback((ok, mode="prod") => {
    if (!current || advancingRef.current) return;
    advancingRef.current = true;
    const xpMode = steps[step] === "Découverte" ? "discover" : steps[step] === "Boss" ? "prod" : mode;
    const xp = ok ? calcXP(state, current, xpMode) : 0;
    const ns = gradeWord(state, current.id, ok ? "good" : "again", mode, xp);
    setState(ns);
    if (ok) setXpSession(x=>x+xp); else setHearts(h=>h-1);
    setLog(l=>[...l,{figure:current,ok,step:steps[step]}]);
    const m = checkMilestones(ns, figures);
    if (m) onMilestone(m);
    timerRef.current = setTimeout(() => {
      setSelected(null); setShown(false); advancingRef.current = false;
      if (idx + 1 >= sources.length) {
        if (step + 1 >= steps.length) setDone(true);
        else { setStep(s=>s+1); setIdx(0); }
      } else setIdx(i=>i+1);
    }, ok ? 650 : 0);
  }, [current, state, setState, step, steps, idx, sources.length, figures, onMilestone]);

  const answer = (o) => {
    if (selected || !current) return;
    setSelected(o.id);
    const ok = o.id === current.id;
    if (ok) advance(true, questionMode === "definition" ? "recog" : "prod");
  };

  if (done) {
    const nOk = log.filter(e=>e.ok).length;
    const nWrong = log.filter(e=>!e.ok).length;
    const wrong = log.filter(e=>!e.ok).map(e=>e.figure);
    return (
      <div style={{display:"flex",flexDirection:"column",gap:14,animation:"fadeSlideIn 0.3s ease"}}>
        <div style={{textAlign:"center",padding:"28px 0 12px"}}>
          <div style={{fontSize:58,marginBottom:10}}>🎭</div>
          <h2 style={{fontSize:25,fontWeight:850,color:C.text,marginBottom:6}}>{variant==="short" ? "Routine courte terminée" : "Routine figures terminée"}</h2>
          <p style={{color:C.sub,fontSize:15}}>+{xpSession} XP · {nOk} ✓ · {nWrong} ✗</p>
        </div>
        {wrong.length > 0 && (
          <Card style={{padding:"14px 18px"}}>
            <p style={{fontSize:12,fontWeight:800,color:C.orange,textTransform:"uppercase",letterSpacing:0.8,margin:"0 0 10px"}}>À retravailler ({wrong.length})</p>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {wrong.map(f=><div key={f.id} style={{padding:"10px 12px",borderRadius:12,background:`${C.orange}08`,border:`1px solid ${C.orange}30`}}><p style={{fontWeight:800,color:C.text,fontSize:14,margin:"0 0 2px"}}>{f.word}</p><p style={{color:C.sub,fontSize:13,margin:0}}>{f.compact}</p></div>)}
            </div>
          </Card>
        )}
        <div style={{display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap"}}>
          <Btn label="Rejouer" variant="primary" onClick={restart}/>
          <Btn label="Retour aux figures" variant="ghost" onClick={onBack}/>
        </div>
      </div>
    );
  }

  if (hearts <= 0) return (
    <div style={{textAlign:"center",padding:"44px 0"}}>
      <div style={{fontSize:54,marginBottom:12}}>💔</div>
      <h2 style={{fontSize:22,fontWeight:800,color:C.text,marginBottom:8}}>Session terminée</h2>
      <p style={{fontSize:14,color:C.sub,lineHeight:1.6,margin:"0 0 20px"}}>Les figures manquées reviendront en priorité.</p>
      <div style={{display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap"}}>
        <Btn label="Rejouer" variant="primary" onClick={restart}/>
        <Btn label="Retour" variant="ghost" onClick={onBack}/>
      </div>
    </div>
  );

  if (!current) return <Card style={{textAlign:"center",padding:"40px 24px",color:C.sub}}>Aucune figure disponible pour cette routine.</Card>;

  const isDiscover = steps[step] === "Découverte";
  const wrong = selected && selected !== current.id;

  return (
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <div style={{display:"flex",gap:8,alignItems:"center"}}>
        <div style={{flex:1,display:"flex",gap:4}}>
          {steps.map((s,i)=><div key={s} style={{flex:1,height:5,borderRadius:99,background:i<step?C.green:i===step?C.indigo:"rgba(0,0,0,0.1)",transition:"background 0.3s"}}/>)}
        </div>
        <span style={{fontSize:14,color:C.red,fontWeight:800,minWidth:52,textAlign:"right"}}>{"♥".repeat(Math.max(0,hearts))}{"♡".repeat(Math.max(0,3-hearts))}</span>
        <span style={{fontSize:14,color:C.orange,fontWeight:800}}>+{xpSession}</span>
      </div>
      <div style={{fontSize:12,color:C.sub,fontWeight:750,letterSpacing:0.8,textTransform:"uppercase"}}>{steps[step]} · {idx+1} / {sources.length}</div>
      <Card className={`question-card ${selected ? (wrong ? "feedback-wrong" : "feedback-correct") : ""}`}>
        {isDiscover ? (
          <>
            <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}><Pill label={current.theme} color={THEME_COLOR[current.theme] || C.indigo}/><Pill label={wordStatus(state,current)} color={STATUS_COLOR[wordStatus(state,current)]}/></div>
            <WordTitle>{current.word}</WordTitle>
            {!shown ? (
              <><FigureExampleBlock figure={current}/><Btn label="Voir la définition" variant="primary" full onClick={()=>setShown(true)}/></>
            ) : (
              <><p style={{fontSize:17,fontWeight:800,color:C.text,margin:"0 0 6px"}}>{current.compact}</p><p style={{fontSize:14,color:C.sub,lineHeight:1.65,margin:"0 0 10px"}}>{current.definition}</p>{current.cloze && <FigureExampleBlock figure={current} masked/>}<Btn label="J'ai compris" variant="success" full onClick={()=>advance(true,"recog")}/></>
            )}
          </>
        ) : (
          <>
            <p style={{fontSize:12,color:C.indigo,fontWeight:850,textTransform:"uppercase",letterSpacing:0.8,margin:"0 0 10px"}}>{q.label}</p>
            <div style={{background:`${C.indigo}08`,borderLeft:`4px solid ${C.indigo}`,borderRadius:"0 14px 14px 0",padding:"14px 16px",margin:"0 0 16px"}}>
              <p style={{fontSize:16,color:C.text,fontStyle:questionMode==="definition"?"normal":"italic",fontWeight:questionMode==="definition"?750:500,lineHeight:1.7,margin:0}}>{q.prompt}</p>
            </div>
            <p style={{fontSize:13,color:C.sub,lineHeight:1.5,margin:"0 0 12px"}}>{q.helper}</p>
            <div className="choice-grid">
              {q.options.map(o=>{
                let bg=C.solid,border=C.border,color=C.text,weight=650;
                if(selected) {
                  if(o.id===current.id) {bg=`${C.green}22`;border=C.green;color=C.green;weight=850;}
                  else if(o.id===selected) {bg=`${C.red}18`;border=C.red;color=C.red;}
                  else color=C.ter;
                }
                return <button key={o.id} disabled={!!selected} onClick={()=>answer(o)} style={{padding:"13px 12px",borderRadius:14,border:`1.5px solid ${border}`,background:bg,textAlign:"left",cursor:selected?"default":"pointer",fontSize:14,fontWeight:weight,color,lineHeight:1.35,transition:"all 0.2s"}}>{q.renderOption(o)}{o.id===current.id&&selected?" ✓":""}</button>;
              })}
            </div>
            {selected && (
              <div style={{marginTop:14,animation:"fadeSlideIn 0.25s ease"}}>
                <p style={{fontSize:13,color:wrong?C.red:C.green,fontWeight:850,margin:"0 0 8px"}}>{wrong ? "À corriger" : "Correct"}</p>
                <p style={{fontSize:15,color:C.text,lineHeight:1.55,margin:"0 0 8px"}}><strong>{current.word}</strong> — {current.compact}</p>
                <FigureExampleBlock figure={current}/>
                {wrong && <Btn label="J'ai compris" variant="primary" full onClick={()=>advance(false, questionMode === "definition" ? "recog" : "prod")}/>}
              </div>
            )}
          </>
        )}
      </Card>
    </div>
  );
}

function FigurePractice({figures,state,setState,onMilestone,mode="identify",onBack}) {
  const [maxQ,setMaxQ] = useState(10);
  const [started,setStarted] = useState(false);
  const [count,setCount] = useState(0);
  const [score,setScore] = useState(0);
  const [done,setDone] = useState(false);
  const [current,setCurrent] = useState(null);
  const [selected,setSelected] = useState(null);
  const askedRef = useRef(new Set());
  const stateRef = useRef(state);
  const timerRef = useRef(null);

  useEffect(()=>{ stateRef.current = state; },[state]);
  useEffect(()=>()=>{ if(timerRef.current) clearTimeout(timerRef.current); },[]);

  const getNext = useCallback(() => {
    const next = candidates(stateRef.current, figures, "smart", 1, askedRef.current)[0];
    if (next) return next;
    askedRef.current = new Set();
    return candidates(stateRef.current, figures, "smart", 1)[0];
  }, [figures]);

  const start = () => {
    askedRef.current = new Set();
    setCount(0); setScore(0); setDone(false); setSelected(null);
    setCurrent(getNext());
    setStarted(true);
  };

  const moveNext = (nextCount) => {
    setCount(nextCount);
    if (nextCount >= maxQ) { setDone(true); setStarted(false); }
    else { setSelected(null); setCurrent(getNext()); }
  };

  const answer = (o) => {
    if (selected || !current) return;
    setSelected(o.id);
    askedRef.current.add(current.id);
    const ok = o.id === current.id;
    const ns = gradeWord(stateRef.current, current.id, ok ? "good" : "again", mode === "definition" ? "recog" : "prod");
    stateRef.current = ns;
    setState(ns);
    const m = checkMilestones(ns, figures);
    if (m) onMilestone(m);
    if (ok) setScore(s => s + 1);
    const next = count + 1;
    if (ok) timerRef.current = setTimeout(()=>moveNext(next), 650);
  };

  const q = useMemo(()=>current ? buildFigureQuestion(current, figures, mode) : null, [current, figures, mode]);

  if (!started && !done) return (
    <Card style={{textAlign:"center",padding:"36px 24px"}}>
      <div style={{fontSize:48,marginBottom:14}}>✒️</div>
      <h2 style={{fontSize:23,fontWeight:850,color:C.text,marginBottom:8}}>{mode === "definition" ? "Figures : définitions" : "Figures : exemples"}</h2>
      <p style={{fontSize:14,color:C.sub,margin:"0 auto 22px",lineHeight:1.6,maxWidth:460}}>
        {mode === "definition" ? "Associe chaque définition courte à la bonne figure de style." : "Observe l'exemple complet et identifie le procédé utilisé. Les exemples masqués restent réservés aux fiches de révision."}
      </p>
      <div style={{display:"flex",gap:10,justifyContent:"center",marginBottom:24,flexWrap:"wrap"}}>
        {[5,10,15,20].map(n=>(
          <button key={n} onClick={()=>setMaxQ(n)} style={{padding:"10px 20px",borderRadius:14,fontWeight:750,fontSize:15,border:`2px solid ${maxQ===n?C.indigo:C.border}`,background:maxQ===n?`${C.indigo}14`:C.solid,color:maxQ===n?C.indigo:C.sub,cursor:"pointer"}}>{n}</button>
        ))}
      </div>
      <div style={{display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap"}}>
        <Btn label={`Démarrer — ${maxQ} questions`} variant="primary" onClick={start}/>
        <Btn label="Retour" variant="ghost" onClick={onBack}/>
      </div>
    </Card>
  );

  if (done) return (
    <Card style={{textAlign:"center",padding:"36px 24px"}}>
      <div style={{fontSize:54,marginBottom:12}}>{score>=maxQ*0.8?"🏆":score>=maxQ*0.5?"👍":"💪"}</div>
      <h2 style={{fontSize:24,fontWeight:850,color:C.text,marginBottom:8}}>{score} / {maxQ}</h2>
      <p style={{fontSize:15,color:C.sub,marginBottom:22}}>Les figures mal identifiées reviendront plus vite.</p>
      <div style={{display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap"}}>
        <Btn label="Rejouer" variant="primary" onClick={start}/>
        <Btn label="Retour aux figures" variant="ghost" onClick={onBack}/>
      </div>
    </Card>
  );

  if (!current || !q) return <div style={{color:C.sub,textAlign:"center",padding:48}}>Chargement…</div>;
  const wrong = selected && selected !== current.id;

  return (
    <div style={{display:"flex",flexDirection:"column",gap:12}}>
      <div style={{display:"flex",alignItems:"center",gap:12}}>
        <div style={{flex:1}}><Bar value={(count/maxQ)*100} color={C.indigo}/></div>
        <span style={{fontSize:13,color:C.sub,fontWeight:650,minWidth:54,textAlign:"right"}}>{count+1} / {maxQ}</span>
        <span style={{fontSize:13,color:C.green,fontWeight:800}}>✓ {score}</span>
      </div>
      <Card className={`question-card ${selected ? (wrong ? "feedback-wrong" : "feedback-correct") : ""}`}>
        <p style={{fontSize:12,color:C.indigo,fontWeight:850,textTransform:"uppercase",letterSpacing:0.8,margin:"0 0 10px"}}>{q.label}</p>
        <div style={{background:`${C.indigo}08`,borderLeft:`4px solid ${C.indigo}`,borderRadius:"0 14px 14px 0",padding:"14px 16px",margin:"0 0 16px"}}>
          <p style={{fontSize:16,color:C.text,fontStyle:mode==="definition"?"normal":"italic",fontWeight:mode==="definition"?750:500,lineHeight:1.7,margin:0}}>{q.prompt}</p>
        </div>
        <p style={{fontSize:13,color:C.sub,lineHeight:1.5,margin:"0 0 12px"}}>{q.helper}</p>
        <div className="choice-grid">
          {q.options.map(o=>{
            let bg=C.solid,border=C.border,color=C.text,weight=650;
            if(selected) {
              if(o.id===current.id) {bg=`${C.green}22`;border=C.green;color=C.green;weight=850;}
              else if(o.id===selected) {bg=`${C.red}18`;border=C.red;color=C.red;}
              else color=C.ter;
            }
            return <button key={o.id} disabled={!!selected} onClick={()=>answer(o)} style={{padding:"13px 12px",borderRadius:14,border:`1.5px solid ${border}`,background:bg,textAlign:"left",cursor:selected?"default":"pointer",fontSize:14,fontWeight:weight,color,lineHeight:1.35,transition:"all 0.2s"}}>{q.renderOption(o)}{o.id===current.id&&selected?" ✓":""}</button>;
          })}
        </div>
        {selected && (
          <div style={{marginTop:14,animation:"fadeSlideIn 0.25s ease"}}>
            <p style={{fontSize:13,color:wrong?C.red:C.green,fontWeight:850,margin:"0 0 8px"}}>{wrong ? "À corriger" : "Correct"}</p>
            <p style={{fontSize:15,color:C.text,lineHeight:1.55,margin:"0 0 8px"}}><strong>{current.word}</strong> — {current.compact}</p>
            <p style={{fontSize:13,color:C.sub,lineHeight:1.55,margin:"0 0 10px"}}>{current.definition}</p>
            <FigureExampleBlock figure={current}/>
            {wrong && <Btn label="Continuer" variant="primary" full onClick={()=>moveNext(count+1)}/>}
          </div>
        )}
      </Card>
    </div>
  );
}

        <StatCard icon="✒️" label="Figures" value={figureTotal} color={C.indigo} sub={`${figureSeen} vues · ${figureMastered} maîtrisées`}/>
      </div>

      <Card>
        <h3 style={{fontSize:16,fontWeight:700,color:C.text,marginTop:0,marginBottom:12}}>Progression globale</h3>

        <p style={{fontSize:13,color:C.sub,marginTop:8,marginBottom:0}}>{mastered} / {total} mots maîtrisés · {seen} vus · {state.meta.xp||0} XP</p>

      <Card>
        <h3 style={{fontSize:16,fontWeight:700,color:C.text,marginTop:0,marginBottom:10}}>Régularité récente</h3>

        <p style={{fontSize:12,color:C.ter,margin:"10px 0 0",lineHeight:1.45}}>28 derniers jours d'activité.</p>

      <Card>

        <div style={{display:"flex",flexDirection:"column",gap:12}}>
